/* ============================ 会话管理（落盘 app/sessions.json） ============================
 * 以前历史只活在内存里：刷新一次全丢，也翻不回去。现在左栏列会话，服务端负责持久化，
 * 贴图由服务端解码成 app/session-files/ 里的文件（见 server.js 的 persistMessages）。 */
let SESS = { list: [], id: null };
let SAVE_T = null;
const DEL_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>';

function fmtWhen(ts) {
  if (!ts) return '';
  const d = new Date(ts), now = new Date(), df = Date.now() - ts;
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (df < 60000) return '刚刚';
  if (df < 3600000) return Math.floor(df / 60000) + ' 分钟前';
  if (d.toDateString() === now.toDateString()) return hm;
  const md = (d.getMonth() + 1) + '/' + d.getDate();
  return (d.getFullYear() === now.getFullYear() ? md : d.getFullYear() + '/' + md) + ' ' + hm;
}
function sessPaint() {
  const box = $('#sideList');
  if (!SESS.list.length) { box.innerHTML = '<div class="cnone">还没有会话</div>'; return; }
  box.innerHTML = SESS.list.map((s) => `<div class="conv${s.id === SESS.id ? ' active' : ''}" data-id="${esc(s.id)}">
      <div class="cc"><div class="ct">${esc(s.title || '新会话')}</div><div class="cm">${esc(fmtWhen(s.updated))} · ${s.count || 0} 条</div></div>
      <button class="cdel" data-del="${esc(s.id)}" title="删除这个会话" aria-label="删除这个会话">${DEL_SVG}</button>
    </div>`).join('');
}
/* 只把这几个字段交给服务端，_text/_imgs/streaming 这类只对当前这一轮有意义 */
function sessSnapshot() {
  return MSGS.map((m) => ({
    id: m.id, role: m.role, text: m.text, think: m.think, err: !!m.err,
    stats: m.stats || null, search: m.search || null,
    tool: m.tool && m.tool.name ? { name: m.tool.name, args: m.tool.args || {} } : null,
    tools: (m.tools || []).map((t) => ({
      id: t.id, name: t.name, args: t.args || {}, preview: t.preview || null, perm: t.perm || 'allow',
      mode: t.mode || 'off', status: t.status === 'ask' || t.status === 'run' ? 'err' : t.status,
      output: t.output || '', ms: t.ms || 0, files: t.files || null, open: !!t.open,
    })),
    stepN: m.stepN || 0, stepMax: m.stepMax || 0,
    docs: (m.docs || []).map((d) => ({
      name: d.name, path: d.path, chars: d.chars, kind: d.kind, ext: d.ext, note: d.note, warn: d.warn,
      pages: d.pages, sheets: d.sheets, slides: d.slides, url: d.url, stored: d.stored, size: d.size,
    })),
    images: (m.images || []).map((im) => ({ url: im.url, file: im.file, w: im.w, h: im.h, size: im.size, name: im.name })),
  }));
}
async function sessSave() {
  if (!SESS.id) return;
  const id = SESS.id;
  try {
    const r = await (await fetch('/api/sessions/' + encodeURIComponent(id), {
      method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ messages: sessSnapshot() }),
    })).json();
    if (r && r.ok) {
      const s = SESS.list.find((x) => x.id === id);
      if (s) { s.title = r.title; s.count = r.count; s.updated = r.updated; sessPaint(); }
    }

async function sessActive(id) {

async function sessOpen(id, opts) {

  const params = { prompt: text, negative: '', width: 1024, height: 1024, steps: 25, seed: -1, batch_size: 1, prefix: 'qwen_out', use_lora: false, lora_strength: 1.0 };
  const timer = setInterval(async () => {
    am.prog = { state: 'running', step: am.prog ? am.prog.step : 0, total: am.prog ? am.prog.total : 25, node: am.prog ? am.prog.node : '', elapsed: (performance.now() - t0) / 1000 };
    render(true);

      if (job && job.state === 'running') am.prog = { state: 'running', step: job.step, total: job.total_steps, node: job.node, elapsed: job.elapsed };
      else if (!s.alive) am.prog = { state: 'waiting', step: 0, total: 0, node: '绘图内核启动中', elapsed: (performance.now() - t0) / 1000 };
    } catch (_) {}
  }, 1500);

    const r = await (await fetch('/api/generate-image', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ params: params, files: [], keepImage: false }) })).json();
    clearInterval(timer);
    am.prog = null; am.tool = null;
    if (!r.ok) throw new Error(r.error || '生成失败');
    const imgs = ((r.job && r.job.images) || []).map((x) => ({ url: x.url, file: x.file, w: x.w, h: x.h, size: x.size }));
    am.images = imgs;
    am.text = imgs.length ? '画好了。' : '（这次没有产出图片）';
    am.stats = { wall_s: (performance.now() - t0) / 1000, gen_tokens: null, prompt_tokens: null, gen_tps: null, images: imgs };
    render(false);

  } catch (e) {
    clearInterval(timer);

}

let imgBootCfg = null, imgBootTrying = false, imgBootFailed = false;
function fillImgSelect(sel, list, dflt) {
  const el = $(sel);
  if (!el) return;
  const arr = (Array.isArray(list) ? list : []).filter((x) => typeof x === 'string' && x);
  let uniq = arr.filter((v, i) => arr.indexOf(v) === i);
  if (!uniq.length) uniq = ['default'];
  const keep = el.value;
  el.innerHTML = uniq.map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  const want = uniq.indexOf(dflt) >= 0 ? dflt : (uniq.indexOf(keep) >= 0 ? keep : uniq[0]);
  el.value = want;
}
async function loadImgBootstrap() {
  if (imgBootCfg || imgBootTrying || imgBootFailed) return imgBootCfg;
  imgBootTrying = true;
  try {
    const c = await (await fetch('/api/image/bootstrap')).json();
    if (!c || !c.ok) throw new Error('bootstrap 没有返回配置');
    imgBootCfg = c;
    const avail = c.available || {}, opt = c.options || {}, dfl = c.defaults || {};
    fillImgSelect('#iunet', avail.diffusion_models, dfl.unet_name);
    fillImgSelect('#iclip', avail.text_encoders, dfl.clip_name);
    fillImgSelect('#ivae', avail.vaes, dfl.vae_name);
    fillImgSelect('#idtype', opt.weight_dtype, 'default');

    fillImgSelect('#icachedev', opt.cache_device, 'auto');
    fillImgSelect('#icachedtype', opt.cache_dtype, 'default');

    resolution: int($('#iresolution').value, 1024),
    denoise: num($('#idenoise_n').value, 1.0),
    canvas_mode: imgCanvasMode(),
    canvas_scale: num($('#icanvas_scale').value, 1.0),
    canvas_px: int($('#icanvas_px').value, 4194304),
    canvas_ratio: $('#icanvas_ratio').value,
    canvas_mp: num($('#icanvas_mp').value, 1.0),
    sampler_name: $('#isampler').value,
    scheduler: $('#isched').value,
    seed: (random || seed < 0) ? -1 : seed,
    prefix: 'qwen_out',
    use_lora: $('#ilora').checked,
    lora_strength: num($('#ilorar').value, 1.0),
  };
  for (const k of ['width', 'height']) p[k] = Math.max(256, Math.min(4096, Math.round(p[k] / 32) * 32));
  // resolution 是「模型看参考图的面积预算」，0 是合法值（= 用参考图原始尺寸），
  // 所以它不能跟着上面的 256 下限走，单独夹。
  p.resolution = Math.max(0, Math.min(4096, Math.round(p.resolution / 32) * 32));
  p.denoise = Math.max(0, Math.min(1, p.denoise));
  // 模型与显存那几项要等内核把选项表给出来才有值：空着就干脆不传，
  // 交给桥自己的兜底（DIFFUSION / ENCODER / VAE / default）。
  const ADV = { unet_name: '#iunet', weight_dtype: '#idtype', clip_name: '#iclip', clip_device: '#iclipdev', vae_name: '#ivae', cache_device: '#icachedev', cache_dtype: '#icachedtype' };
  for (const k in ADV) {
    const el = $(ADV[k]);
    const v = el ? String(el.value || '').trim() : '';
    if (v) p[k] = v;
  }
  return p;
}

async function imgGenerate() {
  if (IMG.busy) return;
  const p = imgParams();
  if (!p.prompt) { toast('先写提示词'); $('#iprompt').focus(); return; }
  if (p.use_lora && p.steps !== 8) toast('LoRA 是 8 步加速版：步数不是 8，图可能糊');
  const files = IMG.files.filter((f) => !f.pending && f.url).map((f) => ({ name: f.name || 'ref.png', data: f.url }));
  setImgBusy(true);
  IMG.job = { state: 'running', step: 0, total_steps: p.steps, images: [] };
  renderNow();
  setGenStatus('提交中…');
  IMG.heal = { idle: 0, lost: false, stall: 0, lastElapsed: -1 };
  IMG.t0 = performance.now();
  if (IMG.timer) clearInterval(IMG.timer);
  /* 轮询要在提交之前就开跑：提交那一次 fetch 本身可能一直不返回（后端重启、
     连接被判死），以前这种情况下界面完全收不到任何状态，就永久停在「正在画 · 0 / N」。 */
  IMG.timer = setInterval(imgPoll, 1500);
  imgPoll();
  /* 提交超时给 16 分钟：后端这次请求是「同步等画完」的（runImageJob 会一直轮到
     done 才回执），而它自己的作业超时是 15 分钟；这里必须比它长，否则会把一张
     还在正常画的大图误判成「掉线了」。真正掉线由 imgPoll 的自愈分支兜住。 */
  let r;
  try {
    r = await (await fetch('/api/image/generate', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      signal: AbortSignal.timeout(960000),
      body: JSON.stringify({ params: p, files: files }),
    })).json();
  } catch (e) {
    /* 超时/断连只说明「等不到提交回执」，不代表内核没在画。不再直接解忙：
       若这次真的没跑起来，imgPoll 的自愈分支会在 3 秒左右把按钮交回来
       （那时才提示「重按生成」）；若其实在画，它就照常显示进度。 */
    if (IMG.heal) IMG.heal.lost = true;
    setGenStatus('等不到提交回执（后端可能刚重启过），已改用内核状态判断…');
    return;
  }
  if (!r.ok) {
    if (IMG.timer) { clearInterval(IMG.timer); IMG.timer = null; }
    setImgBusy(false); setGenStatus(''); renderNow(); toast(r.error || '提交失败');
    return;
  }
  /* 正常回执里就是这一批的成品（后端阻塞到画完才回）。轮询多半已经渲染过同一份，
     这里再补一次，保证「回执到了但轮询正好漏掉」也一定能显示出来。 */
  if (r.job) { IMG.job = r.job; renderNow(); }
}
async function imgPoll() {
  let s;
  try { s = await (await fetch('/api/image/status')).json(); } catch (_) { return; }
  const job = s.job || s;
  if (!s.alive) { setGenStatus('绘图内核启动中…（首次约 30–60 秒）'); return; }
  /* —— 自愈：后端说「空闲 / 没有任务」，界面却还在忙 —— */
  if (!job || !job.state) {
    if (IMG.busy) {
      const H = IMG.heal;
      if (++H.idle >= 2) {
        /* 只在「确实等不到回执」时才认掉线：请求还挂着的时候，后端可能正在
           切模式/拉内核（ensureImage 要停对话、等显存、起桥），这时状态本来就是
           空闲，过早解锁会让用户重按 => bridge 回 busy => 白报一次错。
           60 秒还没见着任务、回执也没来，才认定这次根本没提交上去。 */
        if (H.lost || (performance.now() - IMG.t0) > 60000) {
          H.idle = 0;
          if (IMG.timer) { clearInterval(IMG.timer); IMG.timer = null; }
          setImgBusy(false);
          setGenStatus('这次没提交上去：后端没收到，重按「生成」');
          renderNow();
          H.lost = false;
          if (H.sawDone) loadHistoryImg();   /* 提交丢了、图其实已经画完了 ⇒ 把历史补上 */
        }
      }
    }
    return;
  }
  IMG.heal.idle = 0;
  if (job.state === 'done') IMG.heal.sawDone = true;
  IMG.job = job;
  if (job.state === 'running') {
    /* 进程还在、但进度彻底不动（判断依据用 elapsed，step 在单张 8 步里可能是 0），
       last_seen 落后同样说明桥已经不推它了 ⇒ 判成掉线，按钮交回给用户。 */
    if (IMG.busy) {
      const H = IMG.heal;
      if (H.lastElapsed === job.elapsed) H.stall++;
      else { H.stall = 0; H.lastElapsed = job.elapsed; }
      const freshest = Math.max((job.started || 0), (job.last_seen || 0));
      if (H.stall >= 4 || (freshest && (Date.now() / 1000 - freshest) > 45)) {
        H.stall = 0;
        if (IMG.timer) { clearInterval(IMG.timer); IMG.timer = null; }
        setImgBusy(false);
        setGenStatus('内核在跑，但进度 45 秒没动 —— 重按「生成」，或先点「释放显存」');
        renderNow();
        return;
      }
    }
    $('#nowtitle').textContent = '正在画 · ' + (job.step || 0) + ' / ' + (job.total_steps || 0) + (job.node ? ' · ' + job.node : '') + ' · ' + fmt(job.elapsed, 1) + 's';
    setGenStatus('生成中… ' + (job.step || 0) + ' / ' + (job.total_steps || 0));
  } else if (job.state === 'done') {
    clearInterval(IMG.timer); IMG.timer = null;
    setImgBusy(false);
    renderNow();
    setGenStatus('完成 · ' + ((job.images || []).length) + ' 张 · ' + fmt(job.elapsed, 1) + 's');
    loadHistoryImg();
    toast('出图完成');
  } else if (job.state === 'error') {
    clearInterval(IMG.timer); IMG.timer = null;
    setImgBusy(false); renderNow();
    setGenStatus('失败：' + (job.error || '未知错误'));
  }
}

function renderHistory() {
  const box = $('#history');

  }
  const batches = IMG.history.slice().sort((a, b) => (b.gen || 0) - (a.gen || 0));
  const html = batches.map((b) => {
    const imgs = b.images || [];
    const head = `<div class="hhead">
      <span class="g">第 ${esc(b.gen)} 次</span>
      <span class="m">${b.at ? new Date(b.at * 1000).toLocaleString('zh-CN') : ''} · seed ${esc(b.seed === null || b.seed === undefined ? '–' : b.seed)} · ${esc(b.steps || '?')} 步 · ${fmt(b.elapsed, 1)}s</span>

      return `<div class="hgrp" data-gen="${esc(b.gen)}">${head}
        <div class="hgone">这一批的图片文件已经不在了（提示词和参数还在）。${b.prompt ? '<div class="hprompt" style="margin-top:6px">' + esc(b.prompt) + '</div>' : ''}</div></div>`;
    }
    const refs = (b.refs || []).length ? `<div style="font-size:11.5px;color:#5f6b7a;margin-bottom:6px">参考图 ${b.refs.length} 张</div>` : '';
    const grid = `<div class="hgrid">${imgs.map((im, i) => `<div class="hitem" data-gen="${esc(b.gen)}" data-i="${i}">
        <img class="ph" src="${esc(im.url)}" loading="lazy" alt="">
        <div class="cap">${esc(im.w ? im.w + '×' + im.h : (im.name || ''))} · ${Math.round((im.size || 0) / 1024)} KB${im.cached ? ' · 副本' : ''}</div>
        <div class="acts"><button class="mini" data-act="delimg" data-gen="${esc(b.gen)}" data-name="${esc(im.name || '')}">删除这张</button></div>
      </div>`).join('')}</div>`;
    return `<div class="hgrp" data-gen="${esc(b.gen)}">${head}${refs}${b.prompt ? '<div class="hprompt">' + esc(b.prompt) + '</div>' : ''}<div style="height:8px"></div>${grid}</div>`;
  }).join('');
  box.innerHTML = html;

  box.querySelectorAll('.hitem').forEach((it) => {
    const b = IMG.history.find((x) => String(x.gen) === it.dataset.gen);
    if (!b) return;
    const list = (b.images || []).map((im) => ({ url: im.url, cap: '第 ' + b.gen + ' 次 · ' + (im.w ? im.w + '×' + im.h + ' · ' : '') + Math.round((im.size || 0) / 1024) + ' KB\nseed ' + b.seed + ' · ' + b.steps + ' 步 · ' + fmt(b.elapsed, 1) + 's\n' + (im.file || '') + (b.prompt ? '\n' + b.prompt : '') }));
    const i = Math.min(list.length - 1, +it.dataset.i || 0);
    it.addEventListener('click', (e) => { if (e.target.closest('button')) return; openLightbox(list, i); });
  });
  box.querySelectorAll('button[data-act]').forEach((btn) => btn.onclick = (e) => { e.stopPropagation(); histAction(btn.dataset.act, btn.dataset.gen, btn.dataset.name, btn); });
}

async function histAction(act, gen, name, btn) {
  if (act === 'again') {
    const b = IMG.history.find((x) => String(x.gen) === String(gen));
    if (!b) return;
    const p = b.params || {};
    $('#iprompt').value = b.prompt || '';
    $('#ineg').value = b.negative || '';
    const set = (sel, v) => { if (v !== undefined && v !== null && $(sel)) $(sel).value = v; };
    set('#isteps_n', p.steps); set('#isteps', p.steps);
    set('#icfg_n', p.cfg); set('#icfg', p.cfg);
    set('#iw', p.width); set('#ih', p.height);
    set('#isampler', p.sampler_name); set('#isched', p.scheduler);
    set('#ibatch', p.batch_size);
    if (p.use_lora !== undefined) { $('#ilora').checked = !!p.use_lora; }
    if (p.lora_strength !== undefined) { $('#ilorar').value = p.lora_strength; }
    if (b.seed !== null && b.seed !== undefined) { $('#irandom').checked = false; $('#iseed').disabled = false; $('#iseed').value = b.seed; }
    paintPairLabels();
    toast('参数已回填，可以直接改提示词再生成');
    return;
  }
  if (!histAsk()) return;
  if (btn) btn.disabled = true;
  const withFiles = $('#iwithfiles').checked;
  try {
    if (act === 'delbatch') {
      await fetch('/api/image/history/delete', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ gen: int(gen, -1), files: withFiles }) });
    } else if (act === 'delimg') {
      await fetch('/api/image/history/delete', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ gen: int(gen, -1), name: name, files: withFiles }) });

    await loadHistoryImg();
  } catch (e) { toast('删除失败：' + e.message); if (btn) btn.disabled = false; }
}

/* <select> 只会给字符串，但有些设置是布尔（mmap）而后端按类型判断
 * （`if (!s.mmap)`）：把字符串映射回 schema 自己的值，否则 "false" 会因为
 * 非空字符串为真而静默变成「开启 no-mmap」。 */
function coerce(key, raw) {
  const it = ALL_ITEMS.find((i) => i.key === key);
  if (it && it.options) {
    const hit = it.options.find((p) => String(p[0]) === String(raw));
    if (hit) return hit[0];
  }
  if (it && it.optionsFrom) {
    const hit = (g(STATE, 'chat.catalog.' + it.optionsFrom, []) || []).find((o) => String(o.id) === String(raw));
    if (hit) return hit.id;
  }
  return raw;
}
function fieldHtml(it) {
  const v = DRAFT[it.key];

    ctl = `<select data-k="${esc(it.key)}">${opts.map((p) => `<option value="${esc(p[0])}" ${String(p[0]) === String(v) ? 'selected' : ''}>${esc(p[1])}</option>`).join('')}</select>`;
  } else if (it.type === 'checkbox') {
    ctl = `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-k="${esc(it.key)}" ${v ? 'checked' : ''} style="width:auto"> <span style="font-size:12.5px;color:var(--dim)">${v ? '已启用' : '未启用'}</span></label>`;
  } else if (it.type === 'slider') {

  } else if (it.type === 'number') {

  } else {

  let extra = '';

  return `<div class="field">

    <div class="help">${it.estimate ? `<span class="est">📊 ${esc(it.estimate)}</span>` : ''}</div>${extra}
  </div>`;
}

  }
  panes.push(`<div class="pane" id="pane_status"><div class="note ok">改完点「应用」：热生效的参数立刻发送，启动参数会自动重启引擎。</div><div id="statBox">读取中…</div></div>`);
  $('#setBody').innerHTML = panes.join('');
  $('#tabs').querySelectorAll('button').forEach((b) => b.onclick = () => {
    $('#tabs').querySelectorAll('button').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    $$('#setBody .pane').forEach((p) => p.classList.remove('active'));
    const pane = $('#pane_' + b.dataset.t);
    if (pane) pane.classList.add('active');
    if (b.dataset.t === 'status') renderStatus();
  });
  $('#setBody').querySelectorAll('[data-k]').forEach((el) => {
    const k = el.dataset.k;
    const sync = () => {
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (el.type === 'range' || el.type === 'number') v = Number(v);
      else if (el.tagName === 'SELECT') v = coerce(k, v);
      DRAFT[k] = v;
      const vv = $('#v_' + k);
      if (vv) { const it = ALL_ITEMS.find((i) => i.key === k); vv.textContent = v + (it && it.unit ? ' ' + it.unit : ''); }
      markDirty();
    };
    el.addEventListener('input', sync);
    el.addEventListener('change', sync);
  });
  /* 「选择…」按钮：弹 Windows 文件夹选择框（服务端 PowerShell -STA），拿到路径写进输入框，
   * 之后照常走「应用」落盘 —— 这里不直接改配置文件。 */
  $('#setBody').querySelectorAll('[data-pickdir]').forEach((b) => b.onclick = async () => {
    const k = b.dataset.pickdir;
    const inp = b.parentElement.querySelector('[data-k="' + k + '"]');
    const cur = (inp && inp.value) || '';
    b.disabled = true; const old = b.textContent; b.textContent = '选择中…';
    try {
      const r = await (await fetch('/api/agent/pick-dir', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ current: cur }) })).json();
      if (r && r.ok && r.dir && !r.cancelled) {
        if (inp) { inp.value = r.dir; inp.dispatchEvent(new Event('input', { bubbles: true })); }
      } else if (r && r.error) { toast('选择目录失败：' + r.error); }
    } catch (e) { toast('选择目录失败：' + e.message); }
    b.disabled = false; b.textContent = old;
  });
  $('#setBody').querySelectorAll('[data-preset]').forEach((b) => b.onclick = async () => {
    const id = b.dataset.preset;
    b.disabled = true;
    const n = b.querySelector('.n'); const old = n.textContent;
    n.innerHTML = '应用中… <span class="spin"></span>';
    try {
      const r = await (await fetch('/api/preset', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: id }) })).json();
      $('#setStatus').textContent = (r.ok ? '✔ ' : '✖ ') + (r.restarted ? '已重启引擎；' : '') + (r.lora ? ('LoRA scale → ' + JSON.stringify(r.lora.raw || r.lora.status || '')) : '') + (r.error || '');
      await refresh();
      DRAFT = Object.assign({}, g(STATE, 'chat.settings', {}));
      renderSettings();
      markDirty();
      const st = $('#tabs').querySelector('[data-t="status"]');
      if (st) st.click();
    } catch (e) { $('#setStatus').textContent = '✖ ' + e.message; }
    b.disabled = false; n.textContent = old;
  });
}
function markDirty() {
  if (!STATE || !DRAFT) return;
  const cur = g(STATE, 'chat.settings', {});
  const ch = Object.keys(DRAFT).filter((k) => JSON.stringify(DRAFT[k]) !== JSON.stringify(cur[k]));
  const soft = new Set(['loraScale', 'reasoningEffort', 'maxTokens', 'temperature', 'topP', 'topK', 'minP', 'repeatPenalty', 'seed', 'systemPrompt', 'webSearch', 'imageMaxEdge', 'agentRoot', 'agentMode', 'agentPerm', 'agentMaxSteps', 'agentPermWrite', 'agentPermExec', 'docAutoRead', 'docMaxChars', 'docVision', 'docVisionPages']);
  const hard = ch.filter((k) => !soft.has(k));
  $('#dirty').textContent = ch.length ? (ch.length + ' 项已修改' + (hard.length ? '（' + hard.length + ' 项需重启）' : '（全部热生效）')) : '没有改动';
  $('#dirty').style.color = ch.length ? '#d29922' : 'var(--dim)';
}
async function renderStatus() {
  const st = g(STATE, 'chat', {}), im = g(STATE, 'image', {});
  const s2 = g(STATE, 'chat.settings', {});
  const m = (g(STATE, 'chat.catalog.models', []) || []).find((x) => x.id === s2.model);
  $('#statBox').innerHTML = `
    <div class="field"><div class="lab">对话引擎</div><div class="ctl">${st.alive ? (st.ready ? '运行中 · 就绪' : '运行中 · 启动中') : '未启动'}</div></div>
    <div class="field"><div class="lab">健康检查</div><div class="ctl">${st.ready ? '✔ /health ok' : '✖ 未就绪'}</div></div>
    <div class="field"><div class="lab">监听端口</div><div class="ctl">${esc(st.port)}</div></div>
    <div class="field"><div class="lab">模型权重</div><div class="ctl" style="font-size:12px">${esc(m ? m.name : s2.model || '')}</div>${m && m.note ? `<div class="help">${esc(m.note)}</div>` : ''}</div>
    <div class="field"><div class="lab">启动命令</div><div class="ctl" style="font-size:12px"></div><div class="help"><pre class="log" id="argsBox">读取中…</pre></div></div>
    <div class="field"><div class="lab">LoRA 适配器</div><div class="ctl" style="font-size:12px">${st.loraAdapters ? esc(JSON.stringify(st.loraAdapters)) : '未挂载'}</div></div>
    <div class="field"><div class="lab">绘图桥</div><div class="ctl">${im.alive ? '运行中 · 端口 ' + esc(im.port) : '未启动'}</div></div>
    <div class="field"><div class="lab">ComfyUI</div><div class="ctl">${im.comfyAlive ? '✔ 就绪 · 端口 ' + esc(im.comfyPort) : '✖ 未就绪'}</div></div>
    <div class="field"><div class="lab">应用端口</div><div class="ctl">${esc(g(STATE, 'app.port', ''))} · v${esc(g(STATE, 'app.version', ''))}</div></div>`;
  try {
    const l = await (await fetch('/api/log?which=chat&lines=40')).json();
    const box = $('#argsBox');
    if (box) {
      const txt = String(l.text || '');
      const line = txt.split(/\r?\n/).reverse().find((x) => x.includes('llama-server')) || '(尚无启动记录)';
      box.textContent = line.slice(0, 900);
    }
  } catch (_) {}
}
function openSet() {
  if (!STATE) return;
  DRAFT = Object.assign({}, g(STATE, 'chat.settings', {}));
  renderSettings();
  $('#dirty').textContent = '没有改动';
  $('#setStatus').textContent = '';
  $('#mask').classList.add('show');
  $('#drawer').classList.add('show');
}
function closeSet() { $('#mask').classList.remove('show'); $('#drawer').classList.remove('show'); }
$('#btnSet').onclick = openSet;
$('#btnCloseSet').onclick = closeSet;
$('#mask').onclick = closeSet;
$('#btnRevert').onclick = () => { DRAFT = Object.assign({}, g(STATE, 'chat.settings', {})); renderSettings(); markDirty(); };
$('#btnApply').onclick = async () => {
  const b = $('#btnApply'); b.disabled = true; b.textContent = '应用中…';
  try {
    const r = await (await fetch('/api/settings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ settings: DRAFT }) })).json();
    $('#setStatus').textContent = (r.ok ? '✔ 已应用 ' + ((r.changed || []).length) + ' 项' : '✖ ' + (r.error || ''))
      + (r.restarted ? '（引擎已重启）' : '') + ((r.needRestart || []).length && !r.restarted ? '（需重启：' + r.needRestart.join(',') + '）' : '');
    await refresh();
    DRAFT = Object.assign({}, g(STATE, 'chat.settings', {}));
    renderSettings();
    markDirty();
  } catch (e) { $('#setStatus').textContent = '✖ ' + e.message; }
  b.disabled = false; b.textContent = '应用';
};

/* ================================ 日志 ================================ */
let LOGWHICH = 'chat';
async function loadLog() {
  try {
    const l = await (await fetch('/api/log?which=' + LOGWHICH + '&lines=200')).json();
    $('#logBox').textContent = String(l.text || '(空)');
    $('#logBox').scrollTop = $('#logBox').scrollHeight;
  } catch (e) { $('#logBox').textContent = '读取失败：' + e.message; }
}
function openLog() { $('#maskLog').classList.add('show'); $('#drawerLog').classList.add('show'); loadLog(); }
function closeLog() { $('#maskLog').classList.remove('show'); $('#drawerLog').classList.remove('show'); }
$('#btnLog').onclick = openLog;
$('#btnCloseLog').onclick = closeLog;
$('#maskLog').onclick = closeLog;
$('#logWhich').querySelectorAll('button').forEach((b) => b.onclick = () => {
  $('#logWhich').querySelectorAll('button').forEach((x) => x.classList.remove('on'));
  b.classList.add('on');
  LOGWHICH = b.dataset.w;
  loadLog();
});

/* ================================ 视图切换与轮询 ================================ */
function setTab(t) {
  CURTAB = t;
  document.body.classList.toggle('tab-image', t === 'image');
  $('#tabChat').classList.toggle('active', t === 'chat');
  $('#tabImage').classList.toggle('active', t === 'image');
  $('#paneChat').classList.toggle('active', t === 'chat');
  $('#paneImage').classList.toggle('active', t === 'image');
  if (t === 'chat') $('#bChat').classList.add('hid'); else $('#bImg').classList.add('hid');
  if (t === 'image') { loadHistoryImg(); refresh(); }
}
$('#tabChat').onclick = () => setTab('chat');
$('#tabImage').onclick = () => setTab('image');

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('#lightbox').classList.contains('show')) closeLightbox();
    else { closeSet(); $('#maskLog').classList.remove('show'); }
  } else if ($('#lightbox').classList.contains('show')) {
    if (e.key === 'ArrowLeft') lbStep(-1);
    if (e.key === 'ArrowRight') lbStep(1);
  }
});

/* ---------------------------------------------------------------- boot */
(async function boot() {
  paintPairLabels();
  syncCanvasUI();            // 参考图为空时「宽/高」可用、画幅各子项隐藏，先按默认摆一次
  await sessBoot();          // 会话先就位，render 才有东西可画
  render(false);
  await refresh();
  if (STATE) paintQuick();
  loadHistoryImg();
  setInterval(refresh, 3000);            // 顶栏 / 模式 / 引擎状态
  setInterval(() => { if (CURTAB === 'image' && !IMG.busy) loadHistoryImg(); }, 15000);
  refresh();
  const t = setInterval(() => { if (STATE) { paintQuick(); clearInterval(t); } }, 400);
})();
</script>
