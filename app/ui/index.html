<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Model Studio</title>
<style>
:root{
  --bg:#0d1117; --bg2:#141a22; --bg3:#1b232e; --line:#242e3b; --txt:#e6edf3; --dim:#8b98a8;
  --acc:#4c9aff; --acc2:#2f7ae5; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--bg3);border-radius:8px;padding:7px 12px;transition:.15s}
button:hover{border-color:var(--acc);background:#22303f}
button.primary{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600}
button.primary:hover{background:var(--acc)}
button.danger{border-color:#5a2626;color:#ff9c95}
button.danger:hover{background:#2a1616;border-color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
button.mini{padding:3px 9px;font-size:12px;border-radius:6px}
/* 「开」状态就长在按钮上（联网开关）：亮底 + 白字，不再另起一行文案说明。 */
button.mini.on{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600}
button.mini.on:hover{background:var(--acc);border-color:var(--acc)}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
input[type=range]{width:100%;accent-color:var(--acc)}
textarea{resize:vertical}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2b3644;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
.hid{display:none !important}

/* ---------- title bar ---------- */
header{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.3px;white-space:nowrap}
.logo span{color:var(--acc)}
.status{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);padding:4px 10px;background:var(--bg3);border-radius:20px;border:1px solid var(--line);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.status.mchat{border-color:#1f4529;color:#7ee2a8}
.status.mimage{border-color:#3a2f52;color:#c4b5fd}
.status.mbusy{border-color:#4a3a1a;color:#e3b341}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:0 0 auto}
.dot.on{background:var(--ok);box-shadow:0 0 8px #3fb95088}
.dot.busy{background:var(--warn)}
.spacer{flex:1}
.metrics{display:flex;gap:14px;font-size:12.5px;color:var(--dim);flex-wrap:wrap;align-items:center}
.metrics b{color:var(--txt);font-weight:600}
.metrics .bar{display:inline-block;width:52px;height:6px;border-radius:4px;background:var(--bg3);border:1px solid var(--line);overflow:hidden;vertical-align:-1px}
.metrics .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg3)}
.seg button{border:none;border-radius:0;padding:6px 9px;background:transparent;font-size:12.5px;line-height:1.2}
.seg button:not(:last-child){border-right:1px solid var(--line)}
.seg button.on{background:var(--acc2);color:#fff;font-weight:600}
.seg button.on:hover{background:var(--acc);border-color:transparent}
.tabs{display:flex;gap:4px;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs button{border:none;background:transparent;border-radius:6px;padding:6px 16px;font-size:13.5px}
.tabs button.active{background:var(--acc2);color:#fff;font-weight:600}
.tabs button.active:hover{background:var(--acc)}
.tabs .badge{display:inline-block;min-width:16px;padding:0 4px;margin-left:6px;border-radius:9px;background:#ffffff22;font-size:11px;font-weight:600}
.mtps{font-size:12.5px;color:var(--dim);white-space:nowrap}
.mtps b{color:var(--acc)}

/* ---------- layout ---------- */
main{flex:1;display:flex;min-height:0}
.tabpane{flex:1;display:none;min-width:0;min-height:0}
.tabpane.active{display:flex}
#paneChat{flex-direction:column}
/* min-height:0 必须写在每一层纵向 flex 项上：flex 项默认 min-height:auto 不肯收缩，
 * 漏一层整条链就被内容顶高（曾经 #chatwrap h=2354 在 862 的 pane 里），#msgs 因此
 * 永远 clientHeight==scrollHeight（不滚动），composer 被推到视口外，body 又是 overflow:hidden。 */
#chatwrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
#msgs{flex:1;min-height:0;overflow-y:auto;padding:20px 0}
/* 「回到最新」：只在用户往上翻历史、自动跟随停下来时才出现（见 JS 里的 STICK）。
 * 定位在 composer 顶部之上 12px，所以 #composer 是 position:relative。 */
#btnJump{position:absolute;right:20px;bottom:calc(100% + 12px);z-index:7;width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:50%;background:var(--bg3);color:var(--txt);box-shadow:0 6px 18px #000a}
#btnJump:hover{background:#22303f;color:var(--acc)}
.inner{max-width:860px;margin:0 auto;padding:0 20px}

/* ---------- 会话侧边栏（左侧） ---------- */
#side{flex:0 0 auto;width:236px;display:flex;flex-direction:column;min-height:0;background:var(--bg2);border-right:1px solid var(--line)}
body.noside #side{display:none}
body.tab-image #side{display:none}      /* 生图 tab 有自己的历史列，不再占一列 */
.sidehead{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.sidehead button{flex:1;white-space:nowrap}
#sideList{flex:1;min-height:0;overflow-y:auto;padding:6px}
.conv{display:flex;align-items:center;gap:6px;padding:7px 8px;border:1px solid transparent;border-radius:8px;margin-bottom:2px;cursor:pointer}
.conv:hover{background:var(--bg3)}
.conv.active{background:#1b2a3d;border-color:#2c4666}
.conv .cc{flex:1;min-width:0}
.conv .ct{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .cm{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdel{flex:0 0 auto;width:26px;height:26px;padding:0;display:grid;place-items:center;opacity:0;border-color:transparent;background:transparent;color:var(--dim);transition:.15s}
.conv:hover .cdel,.cdel:focus-visible{opacity:1}
.cdel:hover{opacity:1;color:#ff9c95;border-color:#5a2626;background:#2a1616}
.cdel svg{display:block}
.cnone{padding:16px 10px;color:var(--dim);font-size:12.5px;text-align:center}
.msg{margin-bottom:18px;display:flex;gap:12px}
.avatar{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-size:13px;font-weight:700}
.msg.user .avatar{background:#243447;color:#9dc4ff}
.msg.ai .avatar{background:#1d3326;color:#7ee2a8}
.msg.sys .avatar{background:#33291d;color:#e3b341}
.msg.err .avatar{background:#2a1616;color:#ff9c95}
.bubble{flex:1;min-width:0}
.who{font-size:12px;color:var(--dim);margin-bottom:4px}
.text{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.text code{background:#0b0f14;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:Consolas,monospace;font-size:13px}
.text pre{background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;margin:6px 0}
.text pre code{background:none;border:none;padding:0}
.text b{color:#ffe9a8}
.think{border-left:2px solid #3a4655;margin:0 0 8px;padding:2px 0 2px 12px;color:var(--dim);font-size:12.5px;white-space:pre-wrap;max-height:210px;overflow-y:auto}
.think summary{cursor:pointer;color:#6f7d8c;font-size:12px;user-select:none}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 8px}
.imgs img{max-width:210px;max-height:170px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
.imgs .gen{max-width:330px;max-height:330px}
.imgcap{font-size:11.5px;color:#5f6b7a;margin-top:4px;word-break:break-all;max-width:340px}
.tok{font-size:11.5px;color:#5f6b7a;margin-top:6px}
.empty{color:var(--dim);text-align:center;margin-top:9vh}
.empty h1{font-size:21px;color:var(--txt);margin:0 0 8px}
.empty .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.empty .chips button{font-size:13px}
.step{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--dim);margin:0 0 6px}
.pbar{height:8px;border-radius:5px;background:var(--bg3);border:1px solid var(--line);overflow:hidden;margin:4px 0 8px;max-width:420px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));width:0;transition:width .4s}
.pindet i{width:34%;animation:sweep 1.6s linear infinite}
@keyframes sweep{0%{margin-left:-34%}100%{margin-left:104%}}

/* ---------- agent 工具卡片 ---------- */
.tcard{border:1px solid var(--line);border-radius:9px;background:var(--bg2);margin:0 0 8px;max-width:680px;overflow:hidden;font-size:12.5px}
.tcard .th{display:flex;gap:8px;align-items:center;padding:7px 10px;cursor:pointer;user-select:none}
.tcard .th:hover{background:#182231}
.tcard .ic{flex:0 0 auto;width:18px;text-align:center}
.tcard .nm{font-weight:600;color:#cfe0f5;flex:0 0 auto}
.tcard .ar{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;font-family:Consolas,monospace;font-size:11.5px}
.tcard .st{flex:0 0 auto;font-size:11.5px;color:var(--dim)}
.tcard.run .st{color:var(--acc)}
.tcard.ok .st{color:var(--ok)}
.tcard.err .st,.tcard.denied .st{color:var(--bad)}
.tcard.ask{border-color:#4a3a1a}
.tcard.ask .st{color:var(--warn)}
.tcard .bd{border-top:1px solid var(--line);padding:8px 10px;background:#0b0f14;max-height:340px;overflow:auto}
.tcard .bd pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:Consolas,monospace;font-size:11.5px;color:#c8d4e0}
.tcard .bd .lbl{color:#5f6b7a;font-size:11px;margin:7px 0 3px}
.tcard .bd .lbl:first-child{margin-top:0}
.tcard .bd .old{color:#ffb3ad}
.tcard .bd .new{color:#a5e8b0}
.tcard .acts{display:flex;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line);background:#1c1710}
.tcard .acts .warn{color:var(--warn);font-size:11.5px;margin-right:auto}
details.src{margin:2px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);overflow:hidden;max-width:640px}
details.src>summary{cursor:pointer;padding:7px 11px;font-size:12.5px;color:#9fb4cc;user-select:none;list-style:none}
details.src>summary::-webkit-details-marker{display:none}
details.src>summary::before{content:'▸ '}
details.src[open]>summary::before{content:'▾ '}
.slist{padding:2px 11px 10px}
.sitem{padding:6px 0;border-top:1px dashed #1e2732}
.sitem .t{font-size:12.5px;color:#cfe0f5;font-weight:600}
.sitem .t a{color:#cfe0f5;text-decoration:none}
.sitem .t a:hover{color:var(--acc);text-decoration:underline}
.sitem .u{font-size:11px;color:#4f7fb5;word-break:break-all}
.sitem .s{font-size:12px;color:var(--dim);margin-top:2px}

/* ---------- composer ---------- */
#composer{flex:0 0 auto;position:relative;border-top:1px solid var(--line);background:var(--bg2);padding:10px 0 12px}
.qbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px;font-size:12.5px;color:var(--dim)}
.qbar .grp{display:flex;align-items:center;gap:6px;margin:0}
/* Agent 关着时权限档位整组变灰（不生效，但值还留着） */
.qbar .grp.dim{opacity:.45}
.qbar .grpico{font-size:12px;line-height:1}
/* 工具卡片里的「申请一次性放行」提示条 */
.prow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#ffd479;background:#3a2f10;border:1px solid #5c4a12;border-radius:8px;padding:6px 9px;margin:6px 0}
.prow .ptag{font-weight:600;color:#ffe6a8}
.drop{border:1.5px dashed transparent;border-radius:var(--radius);transition:.15s}
.drop.over{border-color:var(--acc);background:#4c9aff14}
.attach{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.thumb{position:relative}
.thumb img{max-width:76px;max-height:76px;border-radius:8px;border:1px solid var(--line);display:block;object-fit:cover}
.thumb .scaled{position:absolute;bottom:2px;left:2px;font-size:9.5px;background:#000b;border-radius:4px;padding:1px 4px;color:#8fd0ff}
.thumb.pend{width:76px;height:76px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center}
#imgNote{font-size:11.5px;color:#5f6b7a;margin-bottom:6px}
.thumb button{position:absolute;top:-7px;right:-7px;padding:0;width:20px;height:20px;border-radius:50%;line-height:1;background:var(--bad);border:none;color:#fff;font-size:13px}
/* 文档附件：输入框上方那条文档（和图片缩略图并排），以及消息里已发出去的文档条 */
.dthumb{position:relative;display:flex;align-items:center;gap:7px;max-width:320px;background:#151d2a;border:1px solid var(--line);border-radius:9px;padding:6px 9px}
.dthumb .dico{font-size:16px;line-height:1}
.dthumb .dcol{display:flex;flex-direction:column;min-width:0}
.dthumb .dname{font-size:12px;color:#d6e2f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:215px}
.dthumb .dmeta{font-size:10.5px;color:#6f7d8c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:215px}
.dthumb button{position:absolute;top:-7px;right:-7px;padding:0;width:20px;height:20px;border-radius:50%;line-height:1;background:var(--bad);border:none;color:#fff;font-size:13px}
.dthumb.pend{opacity:.7;border-style:dashed}
.dthumb.bad{border-color:#6b3030;background:#2a1a1a}
.dlist{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 6px}
.dchip{display:inline-flex;align-items:center;gap:6px;max-width:340px;background:#141c29;border:1px solid var(--line);border-radius:8px;padding:5px 9px;text-decoration:none;color:#cfe0f5;font-size:12px}
.dchip:hover{border-color:var(--acc)}
.dchip .dname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.dchip .dmeta{color:#6f7d8c;font-size:10.5px;white-space:nowrap}
.frow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row>button{flex:0 0 auto;white-space:nowrap}
textarea#input{flex:1 1 240px;width:auto;min-width:140px;resize:none;max-height:220px;min-height:44px;padding:11px 12px}
#btnAttach{width:44px;height:44px;padding:0;display:grid;place-items:center;color:var(--dim)}
#btnAttach:hover{color:var(--acc)}
#btnAttach svg{display:block}
#btnArt,#btnStop,#btnSend{height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center}
#btnSend{min-width:78px;padding:0 18px}
.hint{font-size:11.5px;color:#5f6b7a;margin-top:7px;display:flex;gap:14px;flex-wrap:wrap}

/* ---------- 生图 ---------- */
#paneImage{overflow:hidden}
#genwrap{flex:1;display:flex;min-height:0}
#genform{width:392px;flex:0 0 auto;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
#genform .fbody{overflow-y:auto;padding:14px 16px 20px;flex:1}
.pcard{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px 13px;margin-bottom:12px}
.pcard h3{margin:0 0 9px;font-size:12.5px;color:var(--acc);letter-spacing:.4px;text-transform:uppercase}
.pcard h3 .r{float:right;color:#8b98a8;text-transform:none;letter-spacing:0;font-weight:400;font-size:11.5px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.mini{display:block;font-size:12px;color:var(--dim);margin-bottom:3px}
label.mini .v{float:right;color:var(--acc);font-variant-numeric:tabular-nums}
.ratios{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ratios button{font-size:12px;padding:4px 8px;border-radius:6px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.presets button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:5px 9px;border-radius:8px;line-height:1.3;text-align:left}
.presets button b{font-size:12px;font-weight:600}
.presets button span{font-size:10.5px;color:var(--dim)}
.presets button.on{border-color:var(--acc);background:#1d2c3e}
.presets button.on b{color:#9dc7ff}
.subhint{font-size:11.5px;color:#5f6b7a;margin-top:5px;line-height:1.5}
details.pcard>summary{cursor:pointer;font-size:12.5px;color:var(--acc);letter-spacing:.4px;text-transform:uppercase;user-select:none;list-style:none}
details.pcard>summary::-webkit-details-marker{display:none}
details.pcard>summary::before{content:'▸ '}
details.pcard[open]>summary::before{content:'▾ '}
.selftest{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.6;white-space:pre-wrap}
.selftest.ok b{color:#7ee2a8}
.selftest.bad b{color:#e3b341}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);cursor:pointer}
.chk input{width:auto}
#gdbuttons{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg3);align-items:center;flex-wrap:wrap}
#btnGen{min-width:150px;font-size:15px;padding:11px 16px}
#btnCancel{min-width:86px;font-size:15px;padding:11px 14px}
#genstatus{font-size:12px;color:var(--dim);width:100%}
#genright{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#nowbar{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap;font-size:12.5px;color:var(--dim)}
#history{flex:1;overflow-y:auto;padding:14px 16px 24px}
.hgrp{margin-bottom:20px}
.hhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.hhead .g{font-weight:700;color:var(--acc);font-size:13.5px}
.hhead .m{font-size:12px;color:var(--dim)}
.hhead .sp{flex:1}
.hgrid{display:flex;gap:10px;flex-wrap:wrap}
.hitem{width:172px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);overflow:hidden;cursor:zoom-in;transition:.15s}
.hitem:hover{border-color:var(--acc)}
.hitem .ph{width:100%;height:172px;display:block;background:#0b0f14;object-fit:cover}
.hitem .ph.broken{display:grid;place-items:center;color:#4b5867;font-size:11.5px;height:172px}
img.broken{border:1px dashed #242e3b;background:#0b0f14;color:#4b5867;font-size:11.5px;display:grid;place-items:center;padding:10px;text-align:center}
.hitem .ph.broken::after{content:'图片打不开'}
.hitem .cap{padding:5px 7px;font-size:11px;color:#6f7d8c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .acts{display:flex;gap:4px;padding:0 5px 5px}
.hitem .acts button{font-size:11px;padding:2px 7px}
.hprompt{font-size:12.5px;color:#9fb4cc;white-space:pre-wrap;overflow-wrap:anywhere;max-width:720px}
.hgone{border:1px dashed #4a3a1a;border-radius:10px;padding:10px 12px;color:#e3b341;font-size:12.5px}
#nowbox{margin-bottom:16px}
.nowimg{max-width:340px;max-height:340px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;display:block}

/* ---------- settings drawer ---------- */
.mask{position:fixed;inset:0;background:#000a;backdrop-filter:blur(2px);display:none;z-index:50}
.mask.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,96vw);background:var(--bg2);border-left:1px solid var(--line);box-shadow:-24px 0 60px #000a;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .2s ease;z-index:60}
.drawer.show{transform:none}
.drawer .dhead{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:13px 16px;font-size:15px;font-weight:600}
.drawer .tabs2{display:flex;gap:6px;padding:0 16px 11px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.drawer .tabs2 button{border-radius:20px;padding:5px 14px;font-size:13px}
.drawer .tabs2 button.active{background:var(--acc2);border-color:var(--acc2);color:#fff}
.drawer .dbody{overflow-y:auto;padding:14px 16px;flex:1}
.drawer .dfoot{display:flex;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg3)}
.pane{display:none}.pane.active{display:block}
.drawer .grp{margin-bottom:20px}
.drawer .grp h3{margin:0 0 10px;font-size:13px;color:var(--acc);letter-spacing:.4px;text-transform:uppercase}
.field{display:grid;grid-template-columns:210px 1fr;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed #1e2732}
.field:last-child{border-bottom:none}
.field .lab{display:flex;align-items:center;gap:6px;font-size:13px}
.field .ctl{display:flex;align-items:center;gap:10px}
.field .ctl .val{min-width:78px;text-align:right;color:var(--acc);font-variant-numeric:tabular-nums;font-size:13px}
.field .ctl input[type=range]{flex:1}
.chip{font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chip.r{border-color:#4a3a1a;color:#d29922}
.help{grid-column:2;font-size:12px;color:var(--dim);margin-top:-2px}
.help .est{color:#7ea6d8;margin-top:3px;display:block}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:16px}
.preset{border:1px solid var(--line);background:var(--bg3);border-radius:10px;padding:12px;text-align:left}
.preset:hover{border-color:var(--acc)}
.preset .n{font-weight:600;margin-bottom:3px}
.preset .d{font-size:12px;color:var(--dim)}
.preset .e{font-size:11.5px;color:#7ea6d8;margin-top:7px;line-height:1.5}
.note{font-size:12.5px;border-radius:8px;padding:9px 12px;margin-bottom:12px;border:1px solid}
.note.warn{background:#d2992212;border-color:#4a3a1a;color:#e3b341}
.note.ok{background:#3fb95012;border-color:#1f4529;color:#7ee2a8}
.note.bad{background:#f8514912;border-color:#5a2626;color:#ff9c95}
pre.log{background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:12px;font:12px/1.5 Consolas,monospace;max-height:320px;overflow:auto;white-space:pre-wrap;margin:0}
.tip{position:relative;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line);color:var(--dim);font-size:10px;cursor:help;flex:0 0 auto}
.tip:hover{border-color:var(--acc);color:var(--acc)}
.tip::after{content:attr(data-tip);position:absolute;left:22px;top:-6px;width:330px;background:#0b0f14;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--txt);box-shadow:0 12px 30px #000c;opacity:0;pointer-events:none;transition:.12s;z-index:60;white-space:normal;font-weight:400}
.tip:hover::after{opacity:1}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--dim);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- lightbox & toast ---------- */
#lightbox{position:fixed;inset:0;background:#000d;backdrop-filter:blur(3px);display:none;z-index:80;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:26px}
#lightbox.show{display:flex}
#lightbox img{max-width:94vw;max-height:78vh;border-radius:10px;box-shadow:0 24px 70px #000;background:#0b0f14}
#lbinfo{font-size:12.5px;color:#c9d6e4;text-align:center;max-width:min(900px,92vw);white-space:pre-wrap;overflow-wrap:anywhere}
#lbbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);background:#0b0f14;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:13px;box-shadow:0 14px 40px #000b;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:80vw}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- narrow ---------- */
@media (max-width:1180px){
  #genform{width:340px}
  .metrics{gap:10px}
}
@media (max-width:1080px){
  #genwrap{flex-direction:column}
  #genform{width:auto;border-right:none;border-bottom:1px solid var(--line);max-height:46vh}
  .field{grid-template-columns:180px 1fr}
}
</style>
</head>
<body>

<header>
  <button id="btnSide" title="收起 / 展开会话列表" aria-label="收起或展开会话列表">☰</button>
  <div class="logo">Local Model <span>Studio</span></div>
  <div class="tabs">
    <button id="tabChat" class="active">💬 对话<span class="badge hid" id="bChat"></span></button>
    <button id="tabImage">🎨 生图<span class="badge hid" id="bImg"></span></button>
  </div>
  <div class="status" id="modePill"><i class="dot" id="modeDot"></i><span id="modeTxt">连接中…</span></div>
  <div class="spacer"></div>
  <div class="metrics">
    <div>显存 <b id="mGpu">–</b></div>
    <div>温度 <b id="mTemp">–</b></div>
    <div>占用 <b id="mUtil">–</b></div>
    <div><span class="bar"><i id="mBar"></i></span></div>
  </div>
  <div class="mtps">本轮 <b id="mTps">–</b> tok/s</div>
  <button id="btnLog">日志</button>
  <button id="btnSet" class="primary">⚙ 设置</button>
</header>

<main>
<aside id="side">
  <div class="sidehead"><button id="btnNew" class="primary" title="开始一个新会话">＋ 新会话</button></div>
  <div id="sideList"></div>
</aside>
<!-- ============================== TAB 1: 对话 ============================== -->
<div class="tabpane active" id="paneChat">
  <div id="chatwrap">
    <div id="msgs"><div class="inner" id="msgsInner"></div></div>
    <div id="composer">
      <button id="btnJump" class="hid" title="回到最新消息（你往上翻的时候不会自动跟随，点这里回到最底部并恢复跟随）" aria-label="回到底部"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v13"/><path d="M5 12l7 7 7-7"/></svg></button>
      <div class="inner">
        <div class="qbar">
          <div class="grp">思考深度
            <div class="seg" id="segEffort">
              <button data-v="none">关闭</button>
              <button data-v="medium">中等</button>
              <button data-v="xhigh">高</button>
            </div>
          </div>
          <div class="grp" id="permGrp" title="Agent 模式在 ⚙ 设置 →「Agent（工具执行）」里控制，默认是「执行」。这一排是沙箱档位：仅可查看＝哪都能读、一个字节也不许写，命令每次都要你点允许；工作区内修改＝读不受限，写只限下面的工作目录；完全权限＝读写到哪都行、命令不再询问">
            <span class="grpico">🛡</span>
            <div class="seg" id="segPerm">
              <button data-v="readonly">仅可查看</button>
              <button data-v="workspace">工作区内修改</button>
              <button data-v="full">完全权限</button>
            </div>
          </div>
          <button id="btnSearch" class="mini">🌐 联网：关</button>
          <div class="spacer"></div>
          <span id="quickNote"></span>
        </div>
        <div class="drop" id="drop">
          <div id="imgNote"></div>
          <div class="attach" id="attach"></div>
          <div class="row">
            <button id="btnAttach" title="添加图片或文档（也能直接 Ctrl+V 粘贴 / 拖拽进来）｜图片：贴图，发送前在浏览器里缩到设置的长边；文档：PDF / Word / Excel / PPT / RTF / HTML / CSV / 文本与代码，先解析出正文再随消息发出去" aria-label="添加图片或文档"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
            <textarea id="input" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行；📎 图片和 PDF / Word / Excel / PPT 等文档都在同一个按钮里，也能直接粘贴或拖进来；图片与扫描件交给本机视觉模型读，第一次会自动打开「识图」并重启引擎）"></textarea>
            <button id="btnArt" title="把输入框里的文字当成绘图提示词，直接出图">🎨 出图</button>
            <button id="btnStop" class="danger hid">⏹ 停止</button>
            <button id="btnSend" class="primary">发送</button>
          </div>
        </div>
        <div class="hint">
          <span id="hintModel">–</span>
          <span id="hintVision"></span>
          <span id="hintLora"></span>
          <span id="hintEngine"></span>
          <span id="hintAgent"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============================== TAB 2: 生图 ============================== -->
<div class="tabpane" id="paneImage">
  <div id="genwrap">
    <div id="genform">
      <div class="fbody">
        <div class="pcard">
          <h3>提示词</h3>
          <textarea id="iprompt" rows="5" placeholder="例：一只戴墨镜的柴犬趴在沙滩上，胶片质感"></textarea>
          <div style="margin-top:11px">
            <label class="mini" style="margin:0">系统级负面词 <span style="color:#5f6b7a">（一直生效 · 自动排在最前面 · 改完自动保存）</span></label>
            <textarea id="isysneg" rows="3" placeholder="例：worst quality, low quality, blurry, watermark, extra fingers"></textarea>
            <div class="subhint" id="isysneghint"></div>
          </div>
          <div style="margin-top:9px">
            <div style="display:flex;gap:6px;align-items:center;margin-bottom:5px">
              <label class="mini" style="margin:0;flex:1">负面提示词 <span style="color:#5f6b7a">（cfg=1 时基本不起作用）</span></label>
              <button class="mini" id="btnSample">示例描述</button>
            </div>
            <textarea id="ineg" rows="2" placeholder="例：文字、水印、多余的手指"></textarea>
          </div>
        </div>

        <div class="pcard">
          <h3>参考图 <span class="r">放了图就是改图</span></h3>
          <div class="drop" id="idrop">
            <div style="font-size:12.5px;color:var(--dim);text-align:center;padding:14px 8px">拖一张图片到这里，或 <span style="color:var(--acc)">点击选择</span></div>
          </div>
          <input type="file" id="ifile" accept="image/*" multiple class="hid">
          <div class="attach" id="ithumbs" style="margin-top:9px"></div>
        </div>

        <div class="pcard">
          <h3>参数 <span class="r">上面这一排是快捷预设</span></h3>
          <div class="presets" id="ipresets" style="margin-bottom:10px"></div>
          <div class="pgrid">
            <div><label class="mini" for="isteps">步数 <span class="v" id="isteps_v">25</span></label>
              <input type="range" id="isteps" min="1" max="60" step="1" value="25"></div>
            <div><label class="mini" for="isteps_n">步数（数值）</label>
              <input type="number" id="isteps_n" min="1" max="200" step="1" value="25"></div>
            <div><label class="mini" for="icfg">cfg <span class="v" id="icfg_v">1.0</span></label>
              <input type="range" id="icfg" min="0" max="8" step="0.1" value="1"></div>
            <div><label class="mini" for="icfg_n">cfg（数值）</label>
              <input type="number" id="icfg_n" min="0" max="20" step="0.1" value="1"></div>
            <div><label class="mini" for="iw">宽</label><input type="number" id="iw" min="256" max="4096" step="32" value="1024"></div>
            <div><label class="mini" for="ih">高</label><input type="number" id="ih" min="256" max="4096" step="32" value="1024"></div>
            <div><label class="mini" for="iseed">随机种子 <span style="color:#5f6b7a">(-1 随机)</span></label><input type="number" id="iseed" value="-1" step="1"></div>
            <div><label class="mini" for="ibatch">一次画几张</label>
              <select id="ibatch"><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div>
            <div><label class="mini" for="isampler">采样器</label>
              <select id="isampler"><option value="euler" selected>euler</option><option value="euler_ancestral">euler_ancestral</option><option value="dpmpp_2m">dpmpp_2m</option><option value="dpmpp_2m_sde">dpmpp_2m_sde</option><option value="uni_pc">uni_pc</option></select></div>
            <div><label class="mini" for="isched">调度器</label>
              <select id="isched"><option value="simple" selected>simple</option><option value="normal">normal</option><option value="beta">beta</option><option value="sgm_uniform">sgm_uniform</option><option value="karras">karras</option></select></div>
          </div>
          <div class="ratios" id="iratios"></div>
          <div style="margin-top:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
            <label class="chk"><input type="checkbox" id="irandom" checked> 随机种子</label>
            <label class="chk"><input type="checkbox" id="ilora"> LoRA 加速</label>
            <label class="mini" style="margin:0;min-width:120px">强度 <span class="v" id="ilora_v">1.0</span></label>
          </div>
          <input type="range" id="ilorar" min="0" max="2" step="0.05" value="1" style="margin-top:6px">
          <div style="font-size:11.5px;color:#5f6b7a;margin-top:6px">LoRA 是 8 步加速版：开启后步数必须改成 8，否则图会糊。</div>
        </div>

        <div class="pcard">
          <h3>画幅与改图 <span class="r">放了参考图才生效</span></h3>
          <label class="mini" for="icanvas">输出画幅</label>
          <select id="icanvas">
            <option value="follow" selected>跟随参考图（默认）</option>
            <option value="origin">按原图比例·原尺寸</option>
            <option value="scale">按原图比例·放大倍数</option>
            <option value="area">按原图比例·指定像素</option>
            <option value="ratio">指定比例 + 像素</option>
            <option value="custom">自定义宽×高（可扩图）</option>
          </select>
          <div class="pgrid" style="margin-top:9px">
            <div id="icanvasScale" class="hid">
              <label class="mini" for="icanvas_scale">放大倍数</label>
              <select id="icanvas_scale">
                <option value="0.5">×0.5（更快）</option>
                <option value="1" selected>×1（原尺寸）</option>
                <option value="1.5">×1.5</option>
                <option value="2">×2</option>
                <option value="3">×3</option>
                <option value="4">×4</option>
              </select>
            </div>
            <div id="icanvasPx" class="hid">
              <label class="mini" for="icanvas_px">输出面积</label>
              <select id="icanvas_px">
                <option value="1048576">1MP（1024²）</option>
                <option value="2359296">2.25MP（1536²）</option>
                <option value="4194304" selected>4MP（2048²）</option>
                <option value="8294400">8.3MP（2880²）</option>
                <option value="16777216">16.7MP（4096²）</option>
              </select>
            </div>
            <div id="icanvasRatio" class="hid">
              <label class="mini" for="icanvas_ratio">输出比例</label>
              <select id="icanvas_ratio">
                <option value="1:1" selected>1:1 方形</option>
                <option value="4:3">4:3</option>
                <option value="3:4">3:4 竖</option>
                <option value="3:2">3:2</option>
                <option value="2:3">2:3 竖</option>
                <option value="16:9">16:9</option>
                <option value="9:16">9:16 竖</option>
                <option value="21:9">21:9 宽</option>
                <option value="9:21">9:21 长竖</option>
                <option value="4:5">4:5 竖</option>
                <option value="5:4">5:4</option>
              </select>
            </div>
            <div id="icanvasMp" class="hid">
              <label class="mini" for="icanvas_mp">输出像素</label>
              <select id="icanvas_mp">
                <option value="0.5">0.5MP</option>
                <option value="1" selected>1MP（1024²）</option>
                <option value="2">2MP</option>
                <option value="4">4MP（2048²）</option>
                <option value="8">8MP</option>
              </select>
            </div>
            <div>
              <label class="mini" for="idenoise">降噪 denoise <span class="v" id="idenoise_v">1.00</span></label>
              <input type="range" id="idenoise" min="0" max="1" step="0.05" value="1">
            </div>
            <div>
              <label class="mini" for="idenoise_n">降噪（数值）<span style="color:#5f6b7a"> · 1.0 = 完全重画</span></label>
              <input type="number" id="idenoise_n" min="0" max="1" step="0.05" value="1">
            </div>
            <div>
              <label class="mini" for="iresolution">参考图像素 resolution</label>
              <input type="number" id="iresolution" min="0" max="4096" step="32" value="1024">
            </div>
          </div>
          <div class="subhint" id="icanvashint"></div>
        </div>

        <div class="pcard" id="icard">
          <h3>绘图内核 <span class="r" id="iqueue">队列 —</span></h3>
          <div style="font-size:12.5px;color:var(--dim)" id="istatus">读取中…</div>
          <div style="font-size:11.5px;color:#5f6b7a;margin-top:7px">出图存在：<b id="ioutdir" style="font-weight:500;color:var(--dim);word-break:break-all">–</b></div>
          <div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap">
            <button class="mini" id="btnBoot">启动绘图内核</button>
            <button class="mini" id="btnFree">释放显存</button>
            <button class="mini" id="btnQuit">停止绘图引擎</button>
            <button class="mini" id="btnOutdir">打开输出目录</button>
            <button class="mini" id="btnPickdir">换输出位置…</button>
            <button class="mini" id="btnSelftest">环境自检</button>
          </div>
          <div class="selftest hid" id="iselftest"></div>
        </div>

        <details class="pcard" id="iadv">
          <summary>模型与显存（8G 卡出问题时来调）</summary>
          <div class="pgrid" style="margin-top:9px">
            <div><label class="mini" for="iunet">主模型 diffusion model</label><select id="iunet"></select></div>
            <div><label class="mini" for="idtype">主模型精度</label><select id="idtype"></select></div>
            <div><label class="mini" for="iclip">文本编码器</label><select id="iclip"></select></div>
            <div><label class="mini" for="iclipdev">编码器运行设备</label><select id="iclipdev"></select></div>
            <div><label class="mini" for="ivae">VAE</label><select id="ivae"></select></div>
            <div><label class="mini" for="icachedev">Cache 设备</label><select id="icachedev"></select></div>
            <div><label class="mini" for="icachedtype">Cache 精度</label><select id="icachedtype"></select></div>
          </div>
          <div class="subhint" id="iadvhint">列表由绘图内核提供：先点「启动绘图内核」（约 30–60 秒），这里才会长出可选项。</div>
        </details>
      </div>
      <div id="gdbuttons">
        <button id="btnGen" class="primary">生成</button>
        <button id="btnCancel" class="danger hid">取消</button>
        <div id="genstatus">就绪</div>
      </div>
    </div>

    <div id="genright">
      <div id="nowbar">
        <span id="nowtitle">还没有本次生成的图</span>
        <span class="spacer" style="flex:1"></span>
        <label class="chk"><input type="checkbox" id="iwithfiles"> 删除时连图片文件一起删</label>
        <button class="mini" id="btnClear" style="margin-left:10px">清空历史</button>
      </div>
      <div id="history"><div class="empty" style="margin-top:8vh"><h1>还没有历史</h1><div>左边写好提示词，点「生成」。</div></div></div>
    </div>
  </div>
</div>
</main>

<!-- ============================== 设置抽屉 ============================== -->
<div class="mask" id="mask"></div>
<div class="drawer" id="drawer">
  <div class="dhead">⚙ 设置<span class="spacer"></span><span id="setStatus" style="font-size:12px;color:var(--dim);font-weight:400"></span><button class="mini" id="btnCloseSet">关闭</button></div>
  <div class="tabs2" id="tabs"></div>
  <div class="dbody" id="setBody"></div>
  <div class="dfoot">
    <button id="btnApply" class="primary">应用</button>
    <button id="btnRevert">放弃修改</button>
    <span class="spacer"></span>
    <span id="dirty" style="font-size:12.5px;color:var(--dim)"></span>
  </div>
</div>

<!-- ============================== 日志 ============================== -->
<div class="mask" id="maskLog"></div>
<div class="drawer" id="drawerLog">
  <div class="dhead">引擎日志
    <div class="seg" id="logWhich" style="margin-left:10px"><button data-w="chat" class="on">对话引擎</button><button data-w="bridge">绘图桥</button></div>
    <span class="spacer"></span><button class="mini" id="btnCloseLog">关闭</button>
  </div>
  <div class="dbody"><pre class="log" id="logBox">加载中…</pre></div>
</div>

<div id="lightbox">
  <img id="lbImg" alt="">
  <div id="lbinfo"></div>
  <div id="lbbar">
    <button id="lbPrev">← 上一张</button>
    <button id="lbNext">下一张 →</button>
    <button id="lbClose">关闭</button>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================================
 * Local Model Studio — 单文件前端
 *   对话 = llama-server (Ternary Bonsai 2 27B)，生图 = Qwen Studio 桥 + ComfyUI
 *   全部同源相对路径；不引入任何外部资源。
 * ==========================================================================*/
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const SAFE = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, (c) => SAFE[c]);
const fmt = (n, d = 0) => (n === null || n === undefined || n === '' || isNaN(n)) ? '–' : Number(n).toFixed(d);
const g = (o, p, d) => { let c = o; for (const k of p.split('.')) { if (c === null || c === undefined) return d; c = c[k]; } return c === undefined ? d : c; };
const num = (v, d) => { const n = parseFloat(v); return isNaN(n) ? d : n; };
const int = (v, d) => { const n = parseInt(v, 10); return isNaN(n) ? d : n; };

let STATE = null, DRAFT = null, ALL_ITEMS = [], CURTAB = 'chat', BUSY = false, ABORT = null;
let LASTSTATE = { msg: '连接中…', cls: '' };

/* ---------------------------------------------------------------- toast / lightbox */
let toastT = null;
function toast(msg, ms) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), ms || 2400);
}
let LB = { list: [], idx: 0 };
function openLightbox(list, idx) {
  LB = { list: list || [], idx: idx || 0 };
  renderLB();
  $('#lightbox').classList.add('show');
}
function renderLB() {
  const it = LB.list[LB.idx];
  if (!it) return;
  $('#lbImg').src = it.url;
  $('#lbinfo').textContent = (it.cap ? it.cap + '\n' : '') + (LB.list.length > 1 ? (LB.idx + 1) + ' / ' + LB.list.length : '');
  $('#lbPrev').classList.toggle('hid', LB.list.length < 2);
  $('#lbNext').classList.toggle('hid', LB.list.length < 2);
}
function closeLightbox() { $('#lightbox').classList.remove('show'); $('#lbImg').src = ''; }
function lbStep(d) { if (!LB.list.length) return; LB.idx = (LB.idx + d + LB.list.length) % LB.list.length; renderLB(); }
$('#lbClose').onclick = closeLightbox;
$('#lbPrev').onclick = () => lbStep(-1);
$('#lbNext').onclick = () => lbStep(1);
$('#lightbox').onclick = (e) => { if (e.target.id === 'lightbox') closeLightbox(); };
$('#lbImg').onclick = () => lbStep(1);

/* 给 #msgsInner 上的图片做事件委托：单击看大图，加载失败显示占位而不是裸「图裂」 */
$('#msgsInner').addEventListener('click', (e) => {
  const im = e.target.closest('img');
  if (!im || !im.src) return;
  const box = im.closest('.imgs');
  const all = box ? Array.from(box.querySelectorAll('img')) : [im];
  const list = all.map((x) => ({ url: x.getAttribute('src'), cap: (x.parentElement && x.parentElement.querySelector('.imgcap') ? x.parentElement.querySelector('.imgcap').textContent : '') || '' }));
  const i = Math.max(0, all.indexOf(im));
  if (list[i]) { list[i].cap = im.dataset.cap || list[i].cap; }
  openLightbox(list, i);
});
document.addEventListener('error', (e) => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.dataset && !t.dataset.failed) {
    t.dataset.failed = '1';
    t.classList.add('broken');
    t.alt = '图片打不开';
    t.title = t.dataset.cap || t.dataset.url || '';
  }
}, true);

/* ---------------------------------------------------------------- 会话消息模型 */
let MSGS = [];   // {id,role,text,think,status,search,tool,tools,prog,images,stats,open,err}
let MSGID = 0;
const newMsg = (role, extra) => Object.assign({ id: ++MSGID, role, text: '', think: '', status: '', search: null, tool: null, tools: [], stepN: 0, stepMax: 0, prog: null, images: [], stats: null, open: false, err: false }, extra || {});
const aiBusy = () => !!(MSGS.length && MSGS[MSGS.length - 1].role === 'assistant' && !MSGS[MSGS.length - 1].done);
let renderQueued = false;
function queueRender() {
  /* 流式 token 每几毫秒就来一条，直接重画会把主线程打满（页面卡到滚不动），
   * 所以节流到 ~90ms 一次。 */
  if (renderQueued) return;
  renderQueued = true;
  setTimeout(() => { renderQueued = false; render(true); }, 90);
}

/* ---------------------------------------------------------------- 状态栏 */
async function refresh() {
  try {
    const r = await fetch('/api/state');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    STATE = await r.json();
  } catch (e) {
    $('#modeTxt').textContent = '界面服务未响应';
    $('#modeDot').className = 'dot';
    return;
  }
  const gpu = STATE.gpu || {};
  const used = num(gpu.used, null), total = num(gpu.total, null);
  $('#mGpu').textContent = (used === null ? '–' : used) + ' / ' + (total === null ? '–' : total) + ' MB';
  $('#mTemp').textContent = (gpu.temp === undefined || gpu.temp === null) ? '–' : (gpu.temp + '°C');
  $('#mUtil').textContent = (gpu.util === undefined || gpu.util === null) ? '–' : (gpu.util + '%');
  $('#mBar').style.width = (used !== null && total) ? Math.min(100, Math.round(used / total * 100)) + '%' : '0';

  const st = STATE.chat || {}, im = STATE.image || {};
  const cell = used !== null ? ('显存 ' + used + ' / ' + total + ' MB' + (gpu.name ? ' · ' + gpu.name : '')) : '显存读取失败';
  if (STATE.switching) {
    LASTSTATE = { msg: ((STATE.switching.note || '正在切换…') + ' '), cls: ' mbusy', spin: true };
  } else if (STATE.mode === 'chat') {
    LASTSTATE = { msg: '对话模型已加载' + (st.ready ? '' : '（启动中…）'), cls: ' mchat' };
  } else if (STATE.mode === 'image') {
    LASTSTATE = { msg: '绘图引擎已加载', cls: ' mimage' };
  } else {
    LASTSTATE = { msg: '空闲（未加载任何模型）', cls: '' };
  }
  $('#modeTxt').textContent = LASTSTATE.msg;
  $('#modeDot').className = 'dot' + (STATE.switching ? ' busy' : (STATE.mode === 'chat' ? ' on' : (STATE.mode === 'image' ? ' busy' : '')));
  $('#modePill').className = 'status' + LASTSTATE.cls;

  const cset = st.settings || {};
  const m = (st.catalog && st.catalog.models || []).find((x) => x.id === cset.model);
  $('#hintModel').textContent = '上下文 ' + (cset.ctx ? Number(cset.ctx).toLocaleString() : '–') + ' · ' + (cset.vision ? '视觉已开' : '纯文本') + (m ? ' · ' + m.name : '');
  $('#hintVision').textContent = cset.vision ? '' : '（发图前需在设置里打开视觉）';
  $('#hintLora').textContent = (!cset.lora || cset.lora === 'none') ? '原版行为' : ('LoRA ' + cset.lora + ' · scale ' + cset.loraScale);
  $('#hintEngine').textContent = st.alive ? ('引擎 ' + (st.ready ? '就绪' : '启动中') + ' · :' + st.port) : ('引擎未启动 · :' + st.port);

  const q = $('#quickNote');
  // 思考深度与联网都是「热生效、逐请求发送」，选项与已存设置不一致时也无需提示 —— 这里恒定留空。
  q.textContent = '';

  // 生图左侧的引擎状态 + 当前任务
  const ist = im.status || {};
  const job = ist.job || ist;
  const busyImg = job && job.state === 'running';
  $('#istatus').innerHTML = im.alive
    ? '桥运行中 · 端口 ' + esc(im.port) + ' · ComfyUI ' + (im.comfyAlive ? '<b style="color:#7ee2a8">已就绪</b>' : '<span style="color:#e3b341">未就绪</span>')
      + (busyImg ? '<br>正在画：' + esc(job.step || 0) + ' / ' + esc(job.total_steps || 0) + (job.node ? ' · ' + esc(job.node) : '') : '')
    : '桥未启动（端口 ' + esc(im.port) + '）· 点「生成」会自动启动，约 30–60 秒';
  if (busyImg) setImgBusy(true); else if (!IMG.busy) setImgBusy(false);

  // 输出位置 / 队列 / （内核起来后）模型与显存的可选项
  IMG.alive = !!im.alive;
  IMG.outDir = im.outDir || '';
  IMG.outDirIsDefault = !!im.outDirIsDefault;
  paintOutDir();
  const qEl = $('#iqueue');
  if (qEl) {
    const run = int(ist.queue_running, 0), pend = int(ist.queue_pending, 0);
    qEl.textContent = !im.alive ? '队列 —' : (run ? ('正在运行 ' + run + ' 个任务') : (pend ? ('排队中 ' + pend) : '队列空闲'));
  }
  if (im.alive) loadImgBootstrap();

  // 系统级负面词：桥在跑就用桥报的值，桥没跑时服务端会直接读 image/settings.json 兜底
  if (im.sysNegative !== undefined) fillSysNegUI(im.sysNegative);   // 桥的 /api/status 不带 system，值以服务端读 settings.json 为准
}

/* ---------------------------------------------------------------- 聊天渲染 */
function searchHtml(sp) {
  const list = (sp.results || []).map((r, i) => `<div class="sitem">
      <div class="t">${i + 1}. ${r.link ? '<a href="' + esc(r.link) + '" target="_blank" rel="noopener noreferrer">' + esc(r.title || r.link) + '</a>' : esc(r.title || '(无标题)')}</div>
      ${r.link ? '<div class="u">' + esc(r.link) + '</div>' : ''}
      ${r.snippet ? '<div class="s">' + esc(r.snippet) + '</div>' : ''}
    </div>`).join('') || '<div class="sitem">没有解析到结果</div>';
  return `<details class="src" ${sp.open ? 'open' : ''} data-openkey="search"><summary>🌐 联网来源：${esc(sp.query || '')}（${(sp.results || []).length} 条）</summary><div class="slist">${list}</div></details>`;
}
/* -------------------------------------------------- agent 工具卡片渲染 */
const TOOL_ICON = { list_files: '📁', read_file: '📄', read_document: '📚', write_file: '✍️', write_document: '📝', edit_file: '✏️', grep: '🔎', run_command: '⌨️', web_search: '🌐', web_fetch: '🔗', generate_image: '🎨', request_permission: '🛡' };
function toolState(t) {
  if (t.status === 'ask') return ['ask', t.name === 'request_permission' ? '等你批准放行' : '等待你确认'];
  if (t.status === 'run') return ['run', '运行中…' + (t.t0 ? ' ' + Math.max(0, Math.round((Date.now() - t.t0) / 1000)) + 's' : '')];
  if (t.status === 'ok') return ['ok', t.ms ? ('完成 · ' + fmt(t.ms / 1000, 1) + 's') : '完成'];
  if (t.status === 'denied') return ['denied', '已拒绝'];
  return ['err', '失败'];
}
/* 正在跑的工具卡片上挂个秒表：命令可能跑几分钟，没有秒表看着就像卡死了。
 * 只改那一个 <span class="st"> 的文本，不整块重绘（避免闪烁）。 */
const __RUN_T = new Map();
function __tickRunning() {
  if (!__RUN_T.size) return;
  const now = Date.now();
  for (const [tid, t0] of __RUN_T) {
    const sel = '[data-tid="' + (window.CSS && CSS.escape ? CSS.escape(tid) : String(tid).replace(/["\\]/g, '\\$&')) + '"] .st';
    const el = document.querySelector('.tcard .th' + sel);
    if (!el) { __RUN_T.delete(tid); continue; }
    el.textContent = '运行中… ' + Math.max(0, Math.round((now - t0) / 1000)) + 's';
  }
}
setInterval(__tickRunning, 1000);
function toolArgLine(t) {
  const p = t.preview || {}, a = t.args || {};
  const one = (v) => String(v === undefined || v === null ? '' : v).replace(/\s+/g, ' ').slice(0, 170);
  if (p.kind === 'perm') return one(p.reason || '');
  if (p.kind === 'exec') return '$ ' + one(p.command);
  if (p.path) return one(p.path);
  if (p.text) return one(p.text);
  const v = a.path || a.query || a.url || a.prompt || '';
  return v ? one(v) : one(JSON.stringify(a));
}
function tcardBody(t) {
  const p = t.preview || {}, a = t.args || {};
  let h = '';
  if (p.kind === 'perm') {
    /* 申请一次性放行：把「要干什么、为什么」摆在卡片上，用户点允许＝这一次放行。 */
    h += '<div class="prow"><span class="ptag">🛡 申请一次性放行</span><span>'
      + esc((p.action === 'exec' ? '要执行命令' : '要写文件') + (p.target ? '：' + p.target : '')) + '</span></div>';
    if (p.reason) h += '<div class="lbl">理由</div><pre>' + esc(p.reason) + '</pre>';
    h += '<div class="lbl">点「允许」后：这一次按「完全权限」放行（只放行这一次，之后照旧按当前档位判定）</div>';
  } else if (t.name === 'edit_file') {
    h += '<div class="lbl">' + esc(p.path || a.path || '') + '</div>';
    if (p.old) h += '<div class="lbl">原内容</div><pre class="old">' + esc(p.old) + '</pre>';
    if (p.fresh) h += '<div class="lbl">改为</div><pre class="new">' + esc(p.fresh) + '</pre>';
  } else if (t.name === 'write_file') {
    h += '<div class="lbl">' + esc(p.path || a.path || '') + (p.bytes ? ' · ' + p.bytes + ' 字节' : '') + '</div>';
    if (p.text) h += '<pre>' + esc(p.text) + (p.bytes > 1500 ? '\n…（预览到这里，完整内容以实际写入为准）' : '') + '</pre>';
  } else if (t.name === 'run_command') {
    h += '<div class="lbl">目录 ' + esc(p.cwd || a.cwd || '.') + '</div><pre>$ ' + esc(p.command || a.command || '') + '</pre>';
  } else {
    h += '<div class="lbl">参数</div><pre>' + esc(JSON.stringify(a, null, 2)) + '</pre>';
  }
  if (t.output) {
    const o = String(t.output);
    h += '<div class="lbl">结果</div><pre>' + esc(o.slice(0, 4000)) + (o.length > 4000 ? '\n…（已截断，共 ' + o.length + ' 字）' : '') + '</pre>';
  }
  if (t.files && t.files.length) {
    h += '<div class="lbl">产出文件</div><div class="frow">'
      + t.files.map((f) => `<button class="mini" data-open="${esc(f)}" title="${esc(f)}">📂 在文件夹里显示</button>`).join('')
      + '</div><pre>' + esc(t.files.join('\n')) + '</pre>';
  }
  return h;
}
function tcardHtml(t) {
  const st = toolState(t);
  const ic = TOOL_ICON[t.name] || '🔧';
  let h = '<div class="tcard ' + st[0] + '">';
  h += '<div class="th" data-tid="' + esc(t.id) + '"><span class="ic">' + ic + '</span><span class="nm">' + esc(t.name)
    + '</span><span class="ar">' + esc(toolArgLine(t)) + '</span><span class="st">' + esc(st[1]) + '</span></div>';
  if (t.open) h += '<div class="bd">' + tcardBody(t) + '</div>';
  if (t.status === 'ask') {
    /* 申请一次性放行的卡片（request_permission）与「被拒后重试的那一次」都只给一次性的
     * 「允许」——「本次会话都允许」对它们没有意义（DSH 里也不存在会话级授权）。 */
    const oneTime = t.oneshot || t.name === 'request_permission';
    h += '<div class="acts"><span class="warn">' + (oneTime ? '要不要放行这一次？' : '这一步要你点一下') + '</span>'
      + '<button class="mini primary" data-approve="allow" data-tid="' + esc(t.id) + '">' + (oneTime ? '允许这一次' : '允许') + '</button>'
      + (oneTime ? '' : '<button class="mini" data-approve="allow_always" data-tid="' + esc(t.id) + '">本次会话都允许</button>')
      + '<button class="mini danger" data-approve="deny" data-tid="' + esc(t.id) + '">拒绝</button></div>';
  }
  return h + '</div>';
}
function toolsHtml(m) {
  const arr = m.tools || [];
  return arr.length ? arr.map(tcardHtml).join('') : '';
}
/* 用户在卡片上点「允许 / 本次会话都允许 / 拒绝」：先本地落状态（界面立刻变），
 * 再把决定发给服务端那个还挂着的 promise。 */
async function agentDecide(tid, decision) {
  let t = null;
  for (const m of MSGS) { const x = (m.tools || []).find((y) => y.id === tid); if (x) { t = x; break; } }
  if (!t) return;
  if (decision === 'allow_always') AGENT_ALLOW.add(t.name);
  t.decision = decision;
  t.status = decision === 'deny' ? 'denied' : 'run';
  t.open = false;
  repaintCards();
  try {
    const r = await fetch('/api/agent/approve', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: tid, decision: decision }) });
    const j = await r.json().catch(() => ({}));
    if (!j || !j.ok) {
      t.status = 'denied';
      t.output = (j && j.error) || '这条确认已经失效了（可能已超时或被取消）';
      t.open = true;
      repaintCards();
    }
  } catch (e) { toast('确认失败：' + e.message); }
}
function repaintCards() { render(!!BUSY); }
/* 工具卡片只用一个委托监听：点卡片头折叠/展开，点按钮做权限决定，点产出文件在资源管理器里定位。 */
$('#msgs').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-approve]');
  if (btn) { e.preventDefault(); agentDecide(btn.dataset.tid, btn.dataset.approve); return; }
  const op = e.target.closest('[data-open]');
  if (op) {
    e.preventDefault();
    fetch('/api/agent/reveal', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ path: op.dataset.open }) })
      .then((r) => r.json()).then((j) => { if (!j || !j.ok) toast('打不开：' + ((j && j.error) || '未知错误')); })
      .catch((err) => toast('打不开：' + err.message));
    return;
  }
  const th = e.target.closest('.tcard .th');
  if (!th) return;
  const tid = th.dataset.tid;
  for (const m of MSGS) {
    const x = (m.tools || []).find((y) => y.id === tid);
    if (x) { x.open = !x.open; repaintCards(); return; }
  }
});
function msgInner(m) {
  let h = '';
  if (m.search) h += searchHtml(m.search);
  if (m.tools && m.tools.length) h += toolsHtml(m);
  if (m.tool) {
    const a = m.tool.args || {};
    const d = a.prompt ? String(a.prompt) : JSON.stringify(a);
    h += `<div class="step"><span class="spin"></span><span>正在生成图片：${esc(d).slice(0, 300)}${m.tool.done ? '（已提交）' : ''}</span></div>`;
  }
  if (m.prog) {
    const p = m.prog, cur = num(p.step, 0), tot = num(p.total, 0);
    const pct = tot ? Math.min(100, Math.round(cur / tot * 100)) : 0;
    h += `<div class="step" style="margin-bottom:2px"><span>${esc(p.state || 'running')} · ${cur} / ${tot || '?'}${p.node ? ' · 节点 ' + esc(p.node) : ''}${p.elapsed ? ' · ' + fmt(p.elapsed, 1) + 's' : ''}</span></div>
      <div class="pbar ${tot ? '' : 'pindet'}"><i style="width:${tot ? pct + '%' : ''}"></i></div>`;
  }
  if (m.status) h += `<div class="step"><span>${esc(m.status)}</span></div>`;
  if (m.think) h += `<details class="think" ${m.open ? 'open' : ''} data-openkey="think"><summary>思考过程（${m.think.length} 字）</summary>${esc(m.think)}</details>`;
  if (m.images && m.images.length) {
    h += '<div class="imgs">' + m.images.map((im) => {
      const capName = String(im.name || '').split(/[\\/]/).pop();
      const cap = capName || im.file || (im.url && im.url.startsWith('data:') ? '' : (im.url || ''));
      const tail = im.w ? (im.w + '×' + im.h + (im.size ? ' · ' + Math.round(im.size / 1024) + ' KB' : '')) : '';
      return `<div><img class="gen" src="${esc(im.url)}" data-cap="${esc(cap)}" loading="lazy" alt="${esc(m.role === 'user' ? (capName || '附件图片') : '生成图')}">${(tail || cap) ? `<div class="imgcap">${esc(tail)}${cap ? '<br>' + esc(cap) : ''}</div>` : ''}</div>`;
    }).join('') + '</div>';
  }
  /* 用户这轮带的文档：一条一条列出来，点开就是服务端存的那份原文件 */
  if (m.docs && m.docs.length) {
    h += '<div class="dlist">' + m.docs.map((d) => `<a class="dchip" href="${esc(d.url || ('/doc-file/' + encodeURIComponent(d.stored || '')))}" target="_blank" rel="noopener" title="${esc((d.path || d.name || '') + '（点击打开 / 下载原文件）')}">
      <span class="dico">${docIcon(d)}</span><span class="dname">${esc(d.name || '文档')}</span><span class="dmeta">${esc(docMeta(d))}</span></a>`).join('') + '</div>';
  }
  const t = esc(m.text);
  h += `<div class="text">${t}${m.streaming ? ' <span class="spin"></span>' : ''}</div>`;
  const foot = footSpans(m);
  if (foot) h += '<div class="tok">' + foot + '</div>';
  return h;
}
/* footer（速度行 / 上限提示 / 统计 / 备注）单独抽出来：流式原地更新要用同一份渲染 */
function footSpans(m) {
  const foot = [];
  if (m.speed) foot.push('<span style="color:#7ea6d8">' + fmt(m.speed, 1) + ' tok/s</span>');
  if (m.stats && m.stats.finish === 'length') foot.push('<span style="color:#e6a23c">⚠ 已到单次输出上限，没写完 —— 发「继续」可接着写，或把设置里的「单次最多输出」调大</span>');
  if (m.stats) foot.push(statsLine(m.stats));
  if (m.meta) foot.push(esc(m.meta));
  if (m.histNote) foot.push('<span style="color:#6f7d8c">' + esc(m.histNote) + '</span>');
  return foot.join(' · ');
}
function statsLine(s) {
  const p = [];
  if (s.gen_tokens !== null && s.gen_tokens !== undefined) p.push(s.gen_tokens + ' tokens');
  if (s.gen_tps) p.push(fmt(s.gen_tps, 1) + ' tok/s');
  if (s.prompt_tokens !== null && s.prompt_tokens !== undefined) p.push('提示 ' + s.prompt_tokens + ' tokens' + (s.prompt_tps ? '（' + fmt(s.prompt_tps, 1) + ' tok/s）' : ''));
  if (s.cached_n) p.push('缓存命中 ' + s.cached_n);
  if (s.wall_s !== null && s.wall_s !== undefined) p.push('用时 ' + fmt(s.wall_s, 1) + 's');
  if (s.images && s.images.length) p.push('出图 ' + s.images.length + ' 张');
  return p.length ? p.join(' · ') : '';
}
function msgNode(m) {
  const cls = m.role === 'user' ? 'user' : (m.role === 'system' ? 'sys' : (m.err ? 'err' : 'ai'));
  const who = m.role === 'user' ? '你' : (m.role === 'system' ? '系统' : (m.err ? '错误' : 'Bonsai'));
  const av = m.role === 'user' ? '你' : (m.role === 'system' ? '调' : (m.err ? '!' : 'AI'));
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.dataset.id = m.id;
  d.innerHTML = `<div class="avatar">${av}</div><div class="bubble"><div class="who">${who}</div><div class="inner2"></div></div>`;
  d.querySelector('.inner2').innerHTML = msgInner(m);
  return d;
}
function bindOpen(node) {
  node.querySelectorAll('[data-openkey]').forEach((el) => {
    el.addEventListener('toggle', () => {
      const m = MSGS.find((x) => String(x.id) === node.dataset.id);
      if (!m) return;
      const k = el.dataset.openkey;
      if (k === 'think') m.open = el.open; else if (m.search) m.search.open = el.open;
    });
  });
}
function patchStreaming(n, m) {
  /* 纯对话的流式输出只做「原地更新」，绝不重建节点。
   * 原因：render() 每 ~90ms 跑一次，整块 innerHTML 重建会把 <details> 换成新节点，
   * 真实鼠标点击的按下与抬起就落在两个不同节点上，click 根本派发不到 <summary>
   * ⇒ 表现就是「思考过程的小三角点不开」（CDP 实测：流式中点击 open 恒为 false，
   * 静止后点击才是 true）。原地更新同时消掉了速度行闪烁。
   * 有工具/进度/联网来源/图片块时结构会中途变化，交回整块重建。 */
  if (m.tool || m.prog || m.search || (m.tools && m.tools.length) || (m.images && m.images.length) || (m.docs && m.docs.length)) return false;
  const inner = n.querySelector('.inner2');
  if (!inner) return false;
  const dt = inner.querySelector('details.think');
  const step = inner.querySelector('.step');
  const tx = inner.querySelector('.text');
  if (!tx) return false;
  if (!!m.think !== !!dt) return false;        // 思考块出现 / 消失 ⇒ 结构变了
  if (!!m.status !== !!step) return false;     // 状态行出现 / 消失
  if (dt) {
    const sm = dt.querySelector('summary');
    if (sm) sm.textContent = '思考过程（' + m.think.length + ' 字）';
    if (dt.childNodes[1]) dt.childNodes[1].nodeValue = m.think;
    else dt.appendChild(document.createTextNode(m.think));
  }
  if (step) step.innerHTML = '<span>' + esc(m.status) + '</span>';
  tx.innerHTML = esc(m.text) + (m.streaming ? ' <span class="spin"></span>' : '');
  const foot = footSpans(m);
  const tok = inner.querySelector('.tok');
  if (tok) { if (foot) tok.innerHTML = foot; else tok.remove(); }
  else if (foot) tx.insertAdjacentHTML('afterend', '<div class="tok">' + foot + '</div>');
  return true;
}
/* ------------------------------------------------- 滚动跟随（#msgs / 思考块）
 * 两个滚动容器，规则不一样：
 *  · #msgs（整段对话）：只有 STICK=true（用户还贴着底部）时才自动跟到最新。
 *    用户往上翻历史时一动不动 —— 以前每 ~90ms 一次的 render 都会无条件
 *    `scrollTop = scrollHeight`，翻历史时会被一次次拽回底部，根本看不了旧消息。
 *    离开底部就弹出右下角 ↓ 按钮，回到最底部（或点它）后自动恢复跟随。
 *  · .think（思考过程，max-height:210px 自带滚动条）：流式生成时跟着最新一行走，
 *    否则里面永远停在开头（用户看到的就是「思考一直在最上面」）；用户在它里面
 *    往上翻过就不再打扰他，翻回底部又自动跟上。 */
const STICK_GAP = 48;          // #msgs 距底部多少 px 以内算「还贴着底部」
const THINK_GAP = 24;          // .think 的判定阈值更小一点，免得挡住他刚滚上去的位置
let STICK = true;
const nearBot = (el, gap) => el.scrollHeight - el.scrollTop - el.clientHeight <= (gap || STICK_GAP);
const FOLLOW = new WeakMap();  // 内部滚动容器（.think）-> 还要不要继续跟着底部
function paintJump() {
  const el = $('#msgs'), b = $('#btnJump');
  if (!el || !b) return;
  b.classList.toggle('hid', STICK || el.scrollHeight - el.clientHeight <= 4);
}
function jumpToBottom() {
  const el = $('#msgs');
  if (!el) return;
  STICK = true;
  el.scrollTop = el.scrollHeight;
  paintJump();
}
$('#msgs').addEventListener('scroll', () => { STICK = nearBot($('#msgs')); paintJump(); }, { passive: true });
/* .think 的 scroll 不冒泡，所以挂在 #msgsInner 的捕获阶段上；程序自己滚到底也会触发一次，
 * 结果同样是「贴着底部」，不会把自己关掉。 */
$('#msgsInner').addEventListener('scroll', (e) => {
  const t = e.target;
  if (t && t.classList && t.classList.contains('think')) FOLLOW.set(t, nearBot(t, THINK_GAP));
}, true);
$('#btnJump').onclick = () => jumpToBottom();
function render(streaming) {
  const box = $('#msgsInner');
  if (!MSGS.length) {
    const vs = g(STATE, 'chat.settings.vision');
    box.innerHTML = `<div class="empty">
      <h1>Ternary Bonsai 2 27B · 本机 8 GB 显存</h1>
      <div>权重只跑在本机显卡上，不联网。${vs ? '视觉塔已加载，可以直接贴图。' : '（当前是纯文本模式，发图请先在 ⚙ 设置里启用视觉。）'}</div>
      <div class="chips">
        <button data-p="用三句话解释什么是三值量化（ternary quantization），以及它为什么能省显存。">解释三值量化</button>
        <button data-p="写一个 Python 函数，判断一个字符串是不是回文，并给出两个测试用例。">写代码</button>
        <button data-p="画一只戴墨镜的柴犬趴在沙滩上，胶片质感。">🎨 画一张图</button>
        <button data-p="Search the web for today's NVIDIA driver release notes and summarise. 记得联网。">联网搜一下</button>
      </div></div>`;
    box.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { $('#input').value = b.dataset.p; $('#input').focus(); });
    return;
  }
  if (box.querySelector('.empty')) box.innerHTML = '';
  /* 只重建「该重建的」：结构变化（增删消息、顺序不对）时全量重建，否则只更新
   * 需要更新的那条。流式输出时每 ~90ms 才更新一次，避免整棵 DOM 每帧重画。 */
  const nodes = Array.from(box.children);
  const structural = nodes.length !== MSGS.length || nodes.some((n, i) => n.dataset.id !== String(MSGS[i].id));
  if (structural) {
    box.innerHTML = '';
    MSGS.forEach((m) => { const n = msgNode(m); bindOpen(n); box.appendChild(n); });
  } else {
    const targets = streaming ? [MSGS[MSGS.length - 1]] : MSGS;
    for (const m of targets) {
      const n = box.querySelector('[data-id="' + m.id + '"]');
      if (!n) continue;
      /* 流式中（还没收尾）走原地更新：保住 <details> 的展开态与点击手感；结构真变了、
       * 或已经收尾，才整块重建（收尾必须重建，否则 footer 永远停在「xx tok/s」）。 */
      if (streaming && m.streaming && patchStreaming(n, m)) continue;
      /* 整块重建会把 <details> 换成新节点 —— 体会丢掉思考块内部的滚动位置，
       * 收尾那次重建就会让思考「跳回开头」，所以先记下来再还回去。
       * 展开态不用管：msgInner 是按 m.open 渲染的，bindOpen 的 toggle 一直把两者同步着。 */
      const oldT = n.querySelector('details.think');
      const keepT = oldT ? { top: oldT.scrollTop, follow: FOLLOW.get(oldT) } : null;
      n.querySelector('.inner2').innerHTML = msgInner(m);
      if (keepT) {
        const nt = n.querySelector('details.think');
        if (nt) {
          nt.scrollTop = keepT.top;
          if (keepT.follow !== undefined) FOLLOW.set(nt, keepT.follow);
        }
      }
      bindOpen(n);
    }
  }
  const el = $('#msgs');
  if (STICK) el.scrollTop = el.scrollHeight;      // 用户翻历史时不打扰他（见上面 STICK 注释）
  paintJump();
  if (streaming && STICK) {
    /* 思考块自己会滚（max-height:210px），跟着最新一行走，否则里面永远停在开头。 */
    const last = MSGS[MSGS.length - 1];
    const ln = last && box.querySelector('[data-id="' + last.id + '"]');
    const tk = ln && ln.querySelector('details.think');
    if (tk && tk.open && tk.scrollHeight - tk.clientHeight > 0 && FOLLOW.get(tk) !== false) tk.scrollTop = tk.scrollHeight;
  }
}
function ensureChatEmpty() {
  if (MSGS.length) return false;
  render(false);
  return true;
}

/* ---------------------------------------------------------------- 贴图 */
function shrink(file, maxEdge) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const scale = Math.min(1, maxEdge / Math.max(im.width, im.height));
      const w = Math.max(1, Math.round(im.width * scale)), h = Math.max(1, Math.round(im.height * scale));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const data = cv.toDataURL('image/jpeg', 0.85);
      resolve({ url: data, name: file.name, w: w, h: h, from: im.width + '×' + im.height, to: w + '×' + h, kb: Math.round(data.length * 0.75 / 1024), scaled: scale < 1 });
    };
    im.onerror = () => {
      URL.revokeObjectURL(url);
      const rd = new FileReader();
      rd.onload = () => resolve({ url: rd.result, name: file.name, w: 0, h: 0, kb: Math.round(file.size / 1024) });
      rd.readAsDataURL(file);
    };
    im.src = url;
  });
}
/* 贴图 downscale：图片 token 成本随边长平方增长（原图 1920×1200 ≈ 4145 prompt token），
 * 所以发送前先在浏览器里缩到 imageMaxEdge。 */
async function addImages(files, bag, renderFn) {
  for (const f of files) {
    if (!f.type || !f.type.startsWith('image/')) continue;
    bag.push({ url: '', name: f.name, pending: true });
    renderFn();
    const a = await shrink(f, (g(STATE, 'chat.settings.imageMaxEdge') || 1280));
    bag[bag.length - 1] = a;
    renderFn();
  }
}

/* ================================ TAB 1 · 对话 ================================ */
let ATTACH = [];
let DOCS = [];
/* 文档附件：原文件 POST 到 /api/upload，落到 app/doc-files/<会话>-doc-<n>-<名字>，
 * 返回 {path, kind, chars, note, pages, sheets…}。正文不在这条路上发给模型 ——
 * 发消息时服务端会把 doc part 换成贴好正文的文本块（超长只贴前 docMaxChars 字）。 */
const DOC_ICON = { pdf: '📕', docx: '📘', xlsx: '📗', pptx: '📙', csv: '📊', json: '🧾', html: '🌐', text: '📄', rtf: '📄', ole: '📎', zip: '🗜', binary: '📦', image: '🖼' };
const DOC_KIND = { pdf: 'PDF', docx: 'Word', xlsx: 'Excel', pptx: 'PPT', csv: '表格', json: 'JSON', html: 'HTML', rtf: 'RTF', ole: '旧版 Office', binary: '二进制', text: '文本' };
function docIcon(d) { return DOC_ICON[d && d.kind] || '📄'; }
function docMeta(d) {
  d = d || {};
  if (d.pending) return '上传并解析中…';
  if (d.ok === false) return String(d.warn || '上传失败').slice(0, 70);
  const p = [];
  if (d.kind && d.kind !== 'text') p.push(DOC_KIND[d.kind] || d.kind);
  if (d.pages) p.push(d.pages + ' 页');
  if (d.slides) p.push(d.slides + ' 张幻灯片');
  if (d.sheets && d.sheets.length) p.push(d.sheets.length + ' 个工作表');
  if (d.chars) p.push(d.chars + ' 字');
  /* 没有可用文字层（图片 / 扫描件 / 坏文字层 PDF）：发消息时服务端会用本机视觉模型读图 */
  if (d.needVision) p.push(d.visionOn === false ? '需识图（设置里是关的）' : '需识图 · 发消息时自动读');
  if (d.size) p.push(Math.max(1, Math.round(d.size / 1024)) + ' KB');
  return p.join(' · ') + (d.warn ? ' ⚠' : '');
}
function renderAttach() {
  const imgs = ATTACH.map((a, i) => a.pending
    ? `<div class="thumb pend"><span class="spin"></span><button data-i="${i}">×</button></div>`
    : `<div class="thumb"><img src="${esc(a.url)}">${a.scaled ? `<span class="scaled">已缩至 ${esc(a.to)}</span>` : ''}<button data-i="${i}">×</button></div>`).join('');
  const docs = DOCS.map((d, i) => `<div class="dthumb${d.pending ? ' pend' : ''}${d.ok === false ? ' bad' : ''}" title="${esc(d.path || d.warn || d.name || '')}">
      <span class="dico">${docIcon(d)}</span>
      <span class="dcol"><span class="dname">${esc(d.name || '文档')}</span><span class="dmeta">${esc(docMeta(d))}</span></span>
      ${d.pending ? '<span class="spin"></span>' : ''}
      <button data-d="${i}" title="移除这份文档">×</button>
    </div>`).join('');
  $('#attach').innerHTML = imgs + docs;
  $('#attach').querySelectorAll('button[data-i]').forEach((b) => b.onclick = () => { ATTACH.splice(+b.dataset.i, 1); renderAttach(); });
  $('#attach').querySelectorAll('button[data-d]').forEach((b) => b.onclick = () => {
    const d = DOCS[+b.dataset.d];
    DOCS.splice(+b.dataset.d, 1);
    /* 顺手把服务端那份临时文件删掉（没上传成功就没有 stored） */
    if (d && d.stored) fetch('/api/upload?stored=' + encodeURIComponent(d.stored), { method: 'DELETE' }).catch(() => {});
    renderAttach();
  });
  const n = ATTACH.filter((a) => !a.pending).length, m = DOCS.filter((d) => !d.pending).length;
  $('#imgNote').textContent = (ATTACH.length || m)
    ? [ATTACH.length ? ATTACH.map((a) => a.pending ? '处理中…' : `${a.from ? a.from + '→' + a.to + ' · ' : ''}${a.kb} KB`).join('　') : '',
       m ? `已附 ${m} 份文档` : ''].filter(Boolean).join('　')
    : '';
}
/* 文档上传：一份一份来（服务端解析要时间），每份先画一个 pending 条，回来再补类型/字数。 */
async function addDocs(files) {
  for (const f of Array.from(files || [])) {
    if (!f) continue;
    if (f.type && f.type.startsWith('image/')) { await addImages([f], ATTACH, renderAttach); continue; }
    const d = { name: f.name, size: f.size, pending: true };
    DOCS.push(d);
    renderAttach();
    try {
      const sid = (SESS && SESS.id) || 'tmp';
      const r = await fetch('/api/upload?name=' + encodeURIComponent(f.name) + '&sid=' + encodeURIComponent(sid),
        { method: 'POST', headers: { 'content-type': 'application/octet-stream' }, body: f });
      const j = await r.json().catch(() => null);
      if (!j || !j.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
      Object.assign(d, j, { pending: false });
    } catch (e) {
      d.pending = false; d.ok = false; d.warn = String((e && e.message) || e);
    }
    renderAttach();
  }
}
/* 拖拽/选择进来的文件按类型分流：图片走贴图（浏览器里缩图），其它一律当文档上传。 */
function addAnyFiles(files) {
  const arr = Array.from(files || []);
  const imgs = arr.filter((f) => f.type && f.type.startsWith('image/'));
  const docs = arr.filter((f) => !(f.type && f.type.startsWith('image/')));
  if (imgs.length) addImages(imgs, ATTACH, renderAttach);
  if (docs.length) addDocs(docs);
}

/* agent 模式：off / build（执行）。**开关只在 ⚙ 设置 →「Agent（工具执行）」里**，
 * 输入框上方不再放这一排；这里只保存服务端生效值，请求时原样带上（AGENT_MODE）。
 * AGENT_ALLOW 是「本次会话都允许」记住的工具名，只活在内存里（刷新就忘），换权限档位会清空。 */
let AGENT_MODE = 'off';
/* 联网搜索开关（#btnSearch）：状态只认这个变量，按钮上的 .on / 文案由 paintSearch 统一画。 */
let WEB_SEARCH = false;
/* 第一次 /api/state 回来之前，快捷开关一律不落盘：那会儿按钮上摆的还是 HTML 里的默认档
 * （中等 / 工作区内修改 / Agent 关），照它存一次就会把用户真正的设置整片覆盖掉。 */
let QUICK_READY = false;
/* 权限档位：readonly / workspace / full —— 照 DeepSeek Harness 的三档沙箱。
 * 读文件三档都不限制；写文件与执行命令按档位判定（服务端为准，这里只负责传值）。 */
let AGENT_PERM = 'workspace';
const AGENT_ALLOW = new Set();
const PERM_NOTE = {
  readonly: '权限：仅可查看（哪都能读，但一个文件也不能写；命令每次都要你点允许）',
  workspace: '权限：工作区内修改（读不受限；只许写工作目录里的文件）',
  full: '权限：完全权限（读写到哪都行、命令不再询问，风险自负）',
};
const FULL_ACCESS_WARN = '确认启用完全权限？\n\n启用完全权限后，智能体将减少确认步骤，并且可以直接执行更多操作，'
  + '包括敏感操作、文件修改或外部命令。仅建议在你信任当前任务时使用。\n\n点「确定」＝我已了解风险，并愿意继续';
function quickPayload() {
  const s = (STATE && STATE.chat && STATE.chat.settings) || {};
  const eff = ($('#segEffort').querySelector('button.on') || {}).dataset;
  const pm = ($('#segPerm').querySelector('button.on') || {}).dataset;
  return {
    /* 优先用服务端下发的那一份（点按钮时各 handler 会先把新值同步进 STATE），DOM 只当兜底 ——
     * 页面刚打开、STATE 还没到的时候，DOM 上摆的是不准的默认值。 */
    reasoningEffort: s.reasoningEffort || (eff && eff.v) || 'medium',
    /* Agent 开关已经挪进设置面板，这里只把当前生效值原样回写 —— 免得改联网或权限档时
     * 把模式一起改掉（body.agent 由服务端读取，写错一次就会静默退化成普通对话）。 */
    agentMode: s.agentMode || AGENT_MODE,
    agentPerm: s.agentPerm || (pm && pm.v) || 'workspace',
    webSearch: !!WEB_SEARCH,
  };
}
/* quiet＝不往右边写文案：联网开关就是这种，开没开直接长在按钮上，再说一句是多余的。
 * 失败信息任何时候都写（quiet 也一样），别把错误也一起静音。 */
async function saveQuick(txt, quiet) {
  if (!QUICK_READY) return;   // 设置还没读回来，这时候写盘＝拿默认值覆盖用户的真实配置
  const p = quickPayload();
  if (!quiet) $('#quickNote').textContent = '保存中…';
  try {
    const r = await (await fetch('/api/settings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ settings: p }) })).json();
    if (r.restarted) {
      $('#quickNote').textContent = '引擎重启中…';
      setTimeout(refresh, 2500);
    } else if (!r.ok) {
      $('#quickNote').textContent = '保存失败：' + (r.error || '');
    } else if (!quiet) {
      $('#quickNote').textContent = txt || '已保存';
    }

/* ---------- 流式对话 ---------- */
/* 这次请求要带上的历史轮次。旧版只发当前这一轮，模型看不到上文，会回「我没有上下文」。
 * 预算按「上下文 - 单次最多输出 - 512」的余量估算（中文约 1.4 字/token，偏保守），
 * 超预算就从最旧的一轮开始丢，并在 footer 里写明截断了多少轮。 */
function histFor(msg) {
  const s = g(STATE, 'chat.settings', {}) || {};
  const ctx = Number(s.ctx || 16384), maxTok = Number(s.maxTokens || 4096);
  let budget = Math.round((ctx - maxTok - 512) * 1.4);
  if (!(budget > 800)) budget = 800;
  const cut = MSGS.indexOf(msg) - 1;                 // 当前这轮 user 之前的历史
  const turns = MSGS.slice(0, cut < 0 ? 0 : cut).filter((m) => !m.streaming && !m.err && m.role !== 'system'
    && (String(m.text || '').trim() || (m.docs || []).length));
  const out = []; let used = 0;
  for (let i = turns.length - 1; i >= 0; i--) {
    const t = histText(turns[i]);
    const docs = (turns[i].docs || []).filter((d) => d && d.path);
    /* 历史里的文档会再次被服务端贴成正文，所以要按 docMaxChars 估进预算 —— 否则
     * 连着几轮带文档，提示会悄悄涨到把 ctx 撑爆。 */
    const cap = Math.min(Number(s.docMaxChars) || 12000, 200000);
    const docCost = docs.reduce((n, d) => n + Math.min(cap, Number(d.chars) || cap) * 1.4 + 60, 0);
    const cost = t.length + 8 + docCost;
    if (used + cost > budget) break;
    used += cost;
    out.unshift({
      role: turns[i].role === 'assistant' ? 'assistant' : 'user',
      content: docs.length
        ? [{ type: 'text', text: t }].concat(docs.map((d) => ({ type: 'doc', path: d.path, name: d.name })))
        : t,
    });
  }
  return { msgs: out, dropped: turns.length - out.length };
}
/* 历史里除了正文，再补一小段「这轮用过哪些工具、成没成」——否则下一轮模型完全不知道
 * 上一轮动过哪些文件，会重复劳动或者对着已改过的内容瞎猜。只留名字+一行摘要，很省。 */
function histText(m) {
  const base = String(m.text || '');
  const docs = (m.docs || []).filter((d) => d && d.path);
  const arr = m.tools || [];
  if (!arr.length && !docs.length) return base;
  const seg = [];
  if (arr.length) seg.push('[这轮用过的工具]\n' + arr.slice(-12).map((t) => {
    const st = t.status === 'ok' ? '成功' : t.status === 'denied' ? '被拒绝' : t.status === 'err' ? '失败' : '未完成';
    return '- ' + t.name + '(' + toolArgLine(t).slice(0, 120) + ') → ' + st;
  }).join('\n'));
  if (docs.length) seg.push('[这轮带了文档] ' + docs.map((d) => d.name + '（' + (d.kind || '文档') + (d.chars ? ' · ' + d.chars + ' 字' : '') + '）').join('、'));
  return base + '\n\n' + seg.join('\n');
}
async function chatStream(msg, useSearch) {
  const parts = [];
  if (msg._text) parts.push({ type: 'text', text: msg._text });
  /* 文档只传「路径 + 名字」，正文由服务端（inlineDocParts）读了贴进对话 —— 这样
   * 界面不用把 PDF 正文塞进浏览器，超长也由 docMaxChars 在服务端统一裁。 */
  for (const d of msg._docs || []) if (d && d.path) parts.push({ type: 'doc', path: d.path, name: d.name || '' });
  for (const a of msg._imgs || []) if (!a.pending && a.url) parts.push({ type: 'image_url', image_url: { url: a.url } });
  const hist = histFor(msg);
  if (hist.dropped) msg.histNote = '上下文超预算，只带了最近 ' + hist.msgs.length + ' 轮（更早的 ' + hist.dropped + ' 轮没带）';
  const payload = { messages: hist.msgs.concat([{ role: 'user', content: parts }]), search: !!useSearch, tools: true, agent: AGENT_MODE, perm: AGENT_PERM, autoAllow: Array.from(AGENT_ALLOW) };
  const r = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload), signal: ABORT.signal });
  if (!r.ok) throw new Error((await r.text()).slice(0, 400) || ('HTTP ' + r.status));
  const rd = r.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await rd.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (!data || data === '[DONE]') continue;
      let j; try { j = JSON.parse(data); } catch (_) { continue; }
      switch (j.type) {
        case 'mode': msg.status = '引擎就绪 · 模式 ' + (j.mode || '') + ' · :' + (j.port || ''); break;
        case 'status': msg.status = j.text || ''; break;
        case 'search': msg.search = { query: j.query, results: j.results || [], open: false }; msg.status = ''; break;
        case 'reasoning': if (msg.status) msg.status = ''; msg.think += (j.text || ''); break;
        case 'delta': if (msg.status) msg.status = ''; msg.text += (j.text || ''); break;
        case 'tool': msg.tool = { name: j.name, args: j.args || {} }; msg.status = ''; break;
        case 'step': msg.stepN = j.n; msg.stepMax = j.max; break;
        case 'tool_call': {
          if (!msg.tools) msg.tools = [];
          msg.tools.push({
            id: j.id, name: j.name, args: j.args || {}, preview: j.preview || null,
            perm: j.perm || 'allow', mode: j.mode || AGENT_MODE, sandbox: j.sandbox || null,
            oneshot: !!j.oneshot,
            status: j.perm === 'ask' ? 'ask' : 'run', open: j.perm === 'ask',
          });
          msg.status = '';
          break;
        }
        case 'tool_wait': {
          const t = (msg.tools || []).find((x) => x.id === j.id);
          if (t) { t.status = 'ask'; t.open = true; }
          __RUN_T.delete(j.id);
          break;
        }
        case 'tool_start': {
          const t = (msg.tools || []).find((x) => x.id === j.id);
          if (t && t.status !== 'ask') { t.status = 'run'; }
          else if (t) { t.status = 'run'; t.open = false; }
          if (t) { t.t0 = Date.now(); __RUN_T.set(j.id, t.t0); }
          break;
        }
        case 'tool_result': {
          const t = (msg.tools || []).find((x) => x.id === j.id);
          if (t) {
            t.status = j.denied ? 'denied' : (j.ok ? 'ok' : 'err');
            t.output = j.output || '';
            t.ms = j.ms || 0;
            t.files = j.files || null;
            if (!j.ok) t.open = true;   // 失败/被拒的把详情摊开，不用手动点
          }
          __RUN_T.delete(j.id);
          break;
        }
        case 'progress': msg.prog = { state: j.state, step: j.step, total: j.total, node: j.node, elapsed: j.elapsed }; break;
        case 'image': {
          msg.images = (msg.images || []).concat(j.images || []);
          msg.promptImg = j.prompt || '';
          /* 出图结果到达后，进度条与工具提示折叠成一段历史说明（不渲染成进行中），
           * 所以这里只收起状态行，保留 tool/prog 供 msgInner 渲染成静态文字。 */
          msg.progDone = msg.prog;
          msg.status = '';
          if (CURTAB !== 'image') { $('#bChat').classList.remove('hid'); }
          if (CURTAB === 'image') { $('#bImg').classList.remove('hid'); }
          break;
        }
        case 'speed': msg.speed = j.tps; $('#mTps').textContent = fmt(j.tps, 1); break;
        case 'stats': msg.stats = j; msg.speed = null; break;
        case 'error': msg.err = true; msg.text += (msg.text ? '\n\n' : '') + '[错误] ' + (j.error || ''); break;
        case 'done': msg.done = true; break;
      }
      queueRender();
    }
  }
}
async function send(forceText) {

    pages: d.pages, sheets: d.sheets, slides: d.slides, url: d.url, stored: d.stored, size: d.size,
  }));
  if (!text && !ATTACH.length && !docs.length) return;
  const imgs = ATTACH.slice();

  $('#input').value = ''; $('#input').style.height = 'auto';
  const useSearch = WEB_SEARCH;
