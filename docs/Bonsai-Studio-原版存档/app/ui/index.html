<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonsai Studio</title>
<style>
:root{
  --bg:#0d1117; --bg2:#141a22; --bg3:#1b232e; --line:#242e3b; --txt:#e6edf3; --dim:#8b98a8;
  --acc:#4c9aff; --acc2:#2f7ae5; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--bg3);border-radius:8px;padding:7px 12px;transition:.15s}
button:hover{border-color:var(--acc);background:#22303f}
button.primary{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600}
button.primary:hover{background:var(--acc)}
button.danger{border-color:#5a2626;color:#ff9c95}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
input[type=range]{width:100%;accent-color:var(--acc)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2b3644;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- title bar ---------- */
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto}
.logo{font-weight:700;letter-spacing:.3px}
.logo span{color:var(--acc)}
.status{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);padding:4px 10px;background:var(--bg3);border-radius:20px;border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:0 0 auto}
.dot.on{background:var(--ok);box-shadow:0 0 8px #3fb95088}
.dot.busy{background:var(--warn)}
.spacer{flex:1}
.metrics{display:flex;gap:14px;font-size:12.5px;color:var(--dim);flex-wrap:wrap}
.metrics b{color:var(--txt);font-weight:600}

/* ---------- layout ---------- */
main{flex:1;display:flex;min-height:0}
#chatwrap{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#msgs{flex:1;overflow-y:auto;padding:22px 0}
.inner{max-width:820px;margin:0 auto;padding:0 20px}
.msg{margin-bottom:20px;display:flex;gap:12px}
.avatar{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-size:13px;font-weight:700}
.msg.user .avatar{background:#243447;color:#9dc4ff}
.msg.ai .avatar{background:#1d3326;color:#7ee2a8}
.bubble{flex:1;min-width:0}
.who{font-size:12px;color:var(--dim);margin-bottom:4px}
.text{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.text code{background:#0b0f14;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:Consolas,monospace;font-size:13px}
.text pre{background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto}
.think{border-left:2px solid #3a4655;margin:0 0 8px;padding:2px 0 2px 12px;color:var(--dim);font-size:12.5px;white-space:pre-wrap;max-height:190px;overflow-y:auto}
.think summary{cursor:pointer;color:#6f7d8c;font-size:12px;user-select:none}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.imgs img{max-width:190px;max-height:150px;border-radius:8px;border:1px solid var(--line)}
.tok{font-size:11.5px;color:#5f6b7a;margin-top:5px}
.empty{color:var(--dim);text-align:center;margin-top:12vh}
.empty h1{font-size:22px;color:var(--txt);margin:0 0 8px}
.empty .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.empty .chips button{font-size:13px}

/* ---------- composer ---------- */
#composer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg2);padding:12px 0 14px}
.drop{border:1.5px dashed transparent;border-radius:var(--radius);transition:.15s}
.drop.over{border-color:var(--acc);background:#4c9aff14}
.attach{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.thumb{position:relative}
.thumb img{max-width:76px;max-height:76px;border-radius:8px;border:1px solid var(--line);display:block}
.thumb .scaled{position:absolute;bottom:2px;left:2px;font-size:9.5px;background:#000b;border-radius:4px;padding:1px 4px;color:#8fd0ff}
.thumb.pend{width:76px;height:76px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center}
#imgNote{font-size:11.5px;color:#5f6b7a;margin-bottom:6px}
.thumb button{position:absolute;top:-7px;right:-7px;padding:0;width:20px;height:20px;border-radius:50%;line-height:1;background:var(--bad);border:none;color:#fff;font-size:13px}
.row{display:flex;gap:10px;align-items:flex-end}
textarea#input{resize:none;max-height:220px;min-height:44px;padding:11px 12px}
.hint{font-size:11.5px;color:#5f6b7a;margin-top:7px;display:flex;gap:14px;flex-wrap:wrap}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:#000a;backdrop-filter:blur(2px);display:none;place-items:center;z-index:50}
.mask.show{display:grid}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:14px;width:min(860px,94vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 60px #000a}
.modal header{background:transparent;border-bottom:1px solid var(--line);padding:14px 18px;font-size:15px;font-weight:600}
.modal .body{overflow-y:auto;padding:16px 18px;flex:1}
.modal footer{display:flex;gap:10px;align-items:center;padding:13px 18px;border-top:1px solid var(--line);background:var(--bg3);border-radius:0 0 14px 14px}
.tabs{display:flex;gap:6px;padding:0 18px 12px;border-bottom:1px solid var(--line)}
.tabs button{border-radius:20px;padding:5px 14px;font-size:13px}
.tabs button.active{background:var(--acc2);border-color:var(--acc2);color:#fff}
.pane{display:none}.pane.active{display:block}
.grp{margin-bottom:20px}
.grp h3{margin:0 0 10px;font-size:13px;color:var(--acc);letter-spacing:.4px;text-transform:uppercase}
.field{display:grid;grid-template-columns:220px 1fr;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed #1e2732}
.field:last-child{border-bottom:none}
.field .lab{display:flex;align-items:center;gap:6px;font-size:13px}
.field .ctl{display:flex;align-items:center;gap:10px}
.field .ctl .val{min-width:78px;text-align:right;color:var(--acc);font-variant-numeric:tabular-nums;font-size:13px}
.field .ctl input[type=range]{flex:1}
.chip{font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chip.r{border-color:#4a3a1a;color:#d29922}
.help{grid-column:2;font-size:12px;color:var(--dim);margin-top:-2px}
.help .est{color:#7ea6d8;margin-top:3px;display:block}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:18px}
.preset{border:1px solid var(--line);background:var(--bg3);border-radius:10px;padding:12px;text-align:left}
.preset:hover{border-color:var(--acc)}
.preset .n{font-weight:600;margin-bottom:3px}
.preset .d{font-size:12px;color:var(--dim)}
.preset .e{font-size:11.5px;color:#7ea6d8;margin-top:7px;line-height:1.5}
.note{font-size:12.5px;border-radius:8px;padding:9px 12px;margin-bottom:12px;border:1px solid}
.note.warn{background:#d2992212;border-color:#4a3a1a;color:#e3b341}
.note.ok{background:#3fb95012;border-color:#1f4529;color:#7ee2a8}
.note.bad{background:#f8514912;border-color:#5a2626;color:#ff9c95}
pre.log{background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:12px;font:12px/1.5 Consolas,monospace;max-height:340px;overflow:auto;white-space:pre-wrap}
.tip{position:relative;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line);color:var(--dim);font-size:10px;cursor:help;flex:0 0 auto}
.tip:hover{border-color:var(--acc);color:var(--acc)}
.tip::after{content:attr(data-tip);position:absolute;left:22px;top:-6px;width:330px;background:#0b0f14;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--txt);box-shadow:0 12px 30px #000c;opacity:0;pointer-events:none;transition:.12s;z-index:60;white-space:normal}
.tip:hover::after{opacity:1}
.tip.left::after{left:auto;right:22px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--dim);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="logo">Bonsai <span>Studio</span></div>
  <div class="status"><i class="dot" id="dot"></i><span id="stateTxt">连接中…</span></div>
  <div class="spacer"></div>
  <div class="metrics">
    <div>显存 <b id="mGpu">–</b></div>
    <div>温度 <b id="mTemp">–</b></div>
    <div>本轮 <b id="mTps">–</b> t/s</div>
  </div>
  <button id="btnServer">停机</button>
  <button id="btnLog">日志</button>
  <button id="btnSet" class="primary">⚙ 系统设置</button>
</header>

<main>
  <div id="chatwrap">
    <div id="msgs"><div class="inner" id="msgsInner"></div></div>
    <div id="composer">
      <div class="inner">
        <div class="drop" id="drop">
          <div id="imgNote"></div>
          <div class="attach" id="attach"></div>
          <div class="row">
            <button id="btnImg" title="添加图片（也可以直接 Ctrl+V 粘贴 / 拖拽进来）">🖼</button>
            <textarea id="input" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行；贴图前请先在「系统设置 → 识图」里启用视觉）"></textarea>
            <button id="btnSend" class="primary">发送</button>
          </div>
        </div>
        <div class="hint">
          <span id="hintModel">–</span>
          <span id="hintVision"></span>
          <span id="hintLora"></span>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- settings modal -->
<div class="mask" id="mask">
  <div class="modal">
    <header>⚙ 系统设置<span class="spacer"></span><span id="setStatus" style="font-size:12px;color:var(--dim);font-weight:400"></span></header>
    <div class="tabs" id="tabs"></div>
    <div class="body" id="setBody"></div>
    <footer>
      <button id="btnApply" class="primary">应用</button>
      <button id="btnRevert">放弃修改</button>
      <span class="spacer"></span>
      <span id="dirty" style="font-size:12.5px;color:var(--dim)"></span>
    </footer>
  </div>
</div>

<!-- log modal -->
<div class="mask" id="maskLog">
  <div class="modal">
    <header>引擎日志<span class="spacer"></span><button onclick="document.getElementById('maskLog').classList.remove('show')">关闭</button></header>
    <div class="body"><pre class="log" id="logBox">加载中…</pre></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let STATE = null, DRAFT = null, ATTACH = [], HISTORY = [], BUSY = false, ALL_ITEMS = [];

/* ---------------------------------------------------------------- helpers */
function fmt(n, d = 0) { return n === null || n === undefined || isNaN(n) ? '–' : Number(n).toFixed(d); }
function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

/* ---------------------------------------------------------------- state */
async function refresh() {
  try {
    const r = await fetch('/api/state');
    STATE = await r.json();
    const s = STATE.server, g = STATE.gpu;
    $('#dot').className = 'dot' + (s.ready ? ' on' : (s.running ? ' busy' : ''));
    $('#stateTxt').textContent = s.ready ? ('运行中 · 端口 ' + s.port) : (s.running ? '启动中…' : '已停止');
    $('#mGpu').textContent = g ? (g.usedMiB + ' / ' + g.totalMiB + ' MiB') : '–';
    $('#mTemp').textContent = g ? (g.tempC + '°C · ' + g.smClock + 'MHz') : '–';
    const md = STATE.catalog.models.find((m) => m.id === STATE.settings.model);
    $('#hintModel').textContent = '上下文 ' + STATE.settings.ctx.toLocaleString() + ' · ' + (STATE.settings.vision ? '视觉已开' : '纯文本');
    $('#hintVision').textContent = STATE.settings.vision ? '' : '（发图前需在设置里打开视觉）';
    $('#hintLora').textContent = STATE.settings.lora === 'none' ? '原版行为' : ('LoRA ' + STATE.settings.lora + ' · scale ' + STATE.settings.loraScale);
    $('#btnServer').textContent = s.running ? '停机' : '开机';
  } catch (e) { $('#stateTxt').textContent = '界面服务未响应'; }
}

/* ---------------------------------------------------------------- chat */
function render() {
  const box = $('#msgsInner');
  if (!HISTORY.length) {
    box.innerHTML = `<div class="empty">
      <h1>Ternary Bonsai 2 27B · 本机 8 GB 显存</h1>
      <div>权重只跑在本机显卡上，不联网。${STATE && STATE.settings.vision ? '视觉塔已加载，可以直接贴图。' : '（当前是纯文本模式，发图请先在系统设置里启用视觉。）'}</div>
      <div class="chips">
        <button data-p="用三句话解释什么是三值量化（ternary quantization），以及它为什么能省显存。">解释三值量化</button>
        <button data-p="写一个 Python 函数，判断一个字符串是不是回文，并给出两个测试用例。">写代码</button>
        <button data-p="Reply with exactly one short sentence: what is 17 times 23?">算术冒烟测试</button>
      </div></div>`;
    box.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { $('#input').value = b.dataset.p; send(); });
    return;
  }
  box.innerHTML = HISTORY.map((m) => {
    const imgs = (m.images || []).length ? `<div class="imgs">${m.images.map((u) => `<img src="${u}">`).join('')}</div>` : '';
    const think = m.thinking ? `<details class="think"><summary>思考过程 (${m.thinking.length} 字)</summary>${esc(m.thinking)}</details>` : '';
    const meta = m.meta ? `<div class="tok">${m.meta}</div>` : '';
    return `<div class="msg ${m.role === 'user' ? 'user' : 'ai'}">
      <div class="avatar">${m.role === 'user' ? '你' : 'AI'}</div>
      <div class="bubble"><div class="who">${m.role === 'user' ? '你' : 'Bonsai'}</div>
      ${imgs}${think}<div class="text">${esc(m.content)}${m.streaming ? '<span class="spin"></span>' : ''}</div>${meta}</div></div>`;
  }).join('');
  const el = $('#msgs');
  el.scrollTop = el.scrollHeight;
}

/* Downscale before upload. Image token cost grows with the square of the edge length,
 * and the engine bills every pixel as prefill, so this is the single biggest lever on
 * how long a picture takes (a raw 1920x1200 photo is ~4145 prompt tokens here). */
function shrink(file) {
  const maxEdge = (STATE && STATE.settings.imageMaxEdge) || 1280;
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const scale = Math.min(1, maxEdge / Math.max(im.width, im.height));
      const w = Math.max(1, Math.round(im.width * scale)), h = Math.max(1, Math.round(im.height * scale));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const data = cv.toDataURL('image/jpeg', 0.85);
      resolve({ url: data, name: file.name, from: im.width + '×' + im.height, to: w + '×' + h,
                kb: Math.round(data.length * 0.75 / 1024), scaled: scale < 1 });
    };
    im.onerror = () => { URL.revokeObjectURL(url); const rd = new FileReader(); rd.onload = () => resolve({ url: rd.result, name: file.name, kb: Math.round(file.size / 1024) }); rd.readAsDataURL(file); };
    im.src = url;
  });
}

async function addImages(files) {
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    ATTACH.push({ url: '', name: f.name, pending: true });
    renderAttach();
    const a = await shrink(f);
    ATTACH[ATTACH.length - 1] = a;
    renderAttach();
  }
}
function renderAttach() {
  $('#attach').innerHTML = ATTACH.map((a, i) => a.pending
    ? `<div class="thumb pend"><span class="spin"></span><button data-i="${i}">×</button></div>`
    : `<div class="thumb"><img src="${a.url}">${a.scaled ? `<span class="scaled">已缩至 ${a.to}</span>` : ''}<button data-i="${i}">×</button></div>`).join('');
  $('#attach').querySelectorAll('button').forEach((b) => b.onclick = () => { ATTACH.splice(+b.dataset.i, 1); renderAttach(); });
  const n = ATTACH.filter((a) => !a.pending).length;
  $('#imgNote').textContent = n ? ATTACH.map((a) => a.pending ? '处理中…' : `${a.from ? a.from + '→' + a.to + ' · ' : ''}${a.kb} KB`).join('　') : '';
}

async function send() {
  if (BUSY) return;
  const text = $('#input').value.trim();
  if (!text && !ATTACH.length) return;
  const images = ATTACH.map((a) => a.url);
  ATTACH = []; renderAttach();
  $('#input').value = ''; $('#input').style.height = 'auto';

  const parts = [];
  if (text) parts.push({ type: 'text', text });
  for (const u of images) parts.push({ type: 'image_url', image_url: { url: u } });
  HISTORY.push({ role: 'user', content: text, images });
  const ai = { role: 'assistant', content: '', thinking: '', streaming: true };
  HISTORY.push(ai);
  render();
  BUSY = true; $('#btnSend').disabled = true;

  const t0 = performance.now();
  let gtok = 0, ttft = null;
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ messages: [{ role: 'user', content: parts }] }) });
    if (!r.ok) { const t = await r.text(); throw new Error(t.slice(0, 400)); }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        let j; try { j = JSON.parse(data); } catch { continue; }
        const d = j.choices && j.choices[0] && j.choices[0].delta;
        if (!d) continue;
        if (d.reasoning_content) ai.thinking += d.reasoning_content;
        if (d.content) { if (ttft === null) ttft = (performance.now() - t0) / 1000; ai.content += d.content; }
        if (j.timings && j.timings.predicted_per_second) {
          gtok = j.timings.predicted_n || gtok;
          $('#mTps').textContent = fmt(j.timings.predicted_per_second, 1);
        }
        render();
      }
    }
    const dt = (performance.now() - t0) / 1000;
    ai.streaming = false;
    ai.meta = `${gtok} token · 共 ${dt.toFixed(1)}s` + (ttft !== null ? ` · 首字 ${ttft.toFixed(1)}s` : '');
  } catch (e) {
    ai.streaming = false;
    ai.content += '\n\n[错误] ' + e.message;
  }
  BUSY = false; $('#btnSend').disabled = false;
  render();
  refresh();
}

/* ---------------------------------------------------------------- settings */
/* A <select> only ever hands back strings, but some settings are booleans (mmap) and the
 * backend type-checks them (`if (!s.mmap)`). Map the string back to the schema's own
 * value so "no-mmap" does not silently become the truthy string "false". */
function coerce(key, raw) {
  const it = ALL_ITEMS.find((i) => i.key === key);
  if (it && it.options) {
    const hit = it.options.find((p) => String(p[0]) === String(raw));
    if (hit) return hit[0];
  }
  if (it && it.optionsFrom) {
    const hit = (STATE.catalog[it.optionsFrom] || []).find((o) => String(o.id) === String(raw));
    if (hit) return hit.id;
  }
  return raw;
}

function fieldHtml(it) {
  const v = DRAFT[it.key];
  let ctl = '';
  const chip = it.restart ? '<span class="chip r">需重启</span>' : '<span class="chip">热生效</span>';
  if (it.type === 'select') {
    const opts = it.optionsFrom
      ? STATE.catalog[it.optionsFrom].map((o) => [o.id, o.name])
      : it.options;
    ctl = `<select data-k="${it.key}">${opts.map(([val, lab]) => `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
  } else if (it.type === 'checkbox') {
    ctl = `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-k="${it.key}" ${v ? 'checked' : ''} style="width:auto"> <span style="font-size:12.5px;color:var(--dim)">${v ? '已启用' : '未启用'}</span></label>`;
  } else if (it.type === 'slider') {
    ctl = `<input type="range" data-k="${it.key}" min="${it.min}" max="${it.max}" step="${it.step}" value="${v}">
           <span class="val" id="v_${it.key}">${v}${it.unit ? ' ' + it.unit : ''}</span>`;
  } else if (it.type === 'number') {
    ctl = `<input type="number" data-k="${it.key}" value="${v}">`;
  } else {
    ctl = `<input type="text" data-k="${it.key}" value="${esc(v)}">`;
  }
  return `<div class="field">
    <div class="lab">${esc(it.label)}<span class="tip" data-tip="${esc(it.help)}">?</span>${chip}</div>
    <div class="ctl">${ctl}</div>
    <div class="help">${it.estimate ? `<span class="est">📊 ${esc(it.estimate)}</span>` : ''}</div>
  </div>`;
}

function renderSettings() {
  ALL_ITEMS = STATE.schema.flatMap((g) => g.items);
  const tabs = [{ id: 'presets', title: '推荐配置' }, ...STATE.schema.map((g) => ({ id: g.group, title: g.title })), { id: 'status', title: '状态' }];
  $('#tabs').innerHTML = tabs.map((t, i) => `<button data-t="${t.id}" class="${i === 0 ? 'active' : ''}">${esc(t.title)}</button>`).join('');
  const panes = [];
  panes.push(`<div class="pane active" id="pane_presets">
    <div class="note ok">点一下即用：需要的参数会自动写入，若涉及启动参数会<b>自动重启引擎</b>（约 8–12 秒）。</div>
    <div class="presets">${STATE.presets.map((p) => `<button class="preset" data-preset="${p.id}">
      <div class="n">${esc(p.name)}</div><div class="d">${esc(p.desc)}</div><div class="e">📊 ${esc(p.estimate)}</div></button>`).join('')}</div>
    <div class="note warn">当前：上下文 ${STATE.settings.ctx.toLocaleString()} · ${STATE.settings.vision ? '视觉已开' : '视觉关闭'} · LoRA ${esc(STATE.settings.lora)} @ ${STATE.settings.loraScale}</div>
  </div>`);
  for (const g of STATE.schema) {
    panes.push(`<div class="pane" id="pane_${g.group}"><div class="grp"><h3>${esc(g.title)}</h3>${g.items.map(fieldHtml).join('')}</div></div>`);
  }
  panes.push(`<div class="pane" id="pane_status">
    <div class="note ok">改完点「应用」：热生效的参数立刻发送，启动参数会自动重启引擎。</div>
    <div id="statBox"></div>
  </div>`);
  $('#setBody').innerHTML = panes.join('');

  $('#tabs').querySelectorAll('button').forEach((b) => b.onclick = () => {
    $('#tabs').querySelectorAll('button').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.pane').forEach((p) => p.classList.remove('active'));
    $('#pane_' + b.dataset.t).classList.add('active');
    if (b.dataset.t === 'status') renderStatus();
  });

  $('#setBody').querySelectorAll('[data-k]').forEach((el) => {
    const k = el.dataset.k;
    const sync = () => {
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (el.type === 'range' || el.type === 'number') v = Number(v);
      else if (el.tagName === 'SELECT') v = coerce(k, v);
      DRAFT[k] = v;
      const vv = $('#v_' + k);
      if (vv) { const it = ALL_ITEMS.find((i) => i.key === k); vv.textContent = v + (it && it.unit ? ' ' + it.unit : ''); }
      markDirty();
    };
    el.addEventListener('input', sync);
    el.addEventListener('change', sync);
  });

  $('#setBody').querySelectorAll('[data-preset]').forEach((b) => b.onclick = async () => {
    const id = b.dataset.preset;
    b.disabled = true; b.querySelector('.n').innerHTML = '应用中… <span class="spin"></span>';
    const r = await (await fetch('/api/preset', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id }) })).json();
    b.disabled = false;
    $('#setStatus').textContent = (r.ok ? '✔ ' : '✖ ') + (r.restarted ? '已重启引擎；' : '') + (r.lora ? ('LoRA scale → ' + r.lora.body + '；') : '') + (r.error || '');
    await refresh();
    DRAFT = { ...STATE.settings };
    renderSettings();
    $('#tabs').querySelector(`[data-t="status"]`).click();
  });
}

function markDirty() {
  const ch = Object.keys(DRAFT).filter((k) => JSON.stringify(DRAFT[k]) !== JSON.stringify(STATE.settings[k]));
  const soft = new Set(['loraScale', 'reasoningEffort', 'maxTokens', 'temperature', 'topP', 'topK', 'minP', 'repeatPenalty', 'seed', 'systemPrompt']);
  const hard = ch.filter((k) => !soft.has(k));
  $('#dirty').textContent = ch.length ? (ch.length + ' 项已修改' + (hard.length ? '（' + hard.length + ' 项需重启）' : '（全部热生效）')) : '没有改动';
  $('#dirty').style.color = ch.length ? '#d29922' : 'var(--dim)';
}

async function renderStatus() {
  const s = STATE.server;
  $('#statBox').innerHTML = `
    <div class="field"><div class="lab">引擎进程</div><div class="ctl">${s.running ? ('运行中 pid ' + s.pid) : '已停止'}</div></div>
    <div class="field"><div class="lab">健康检查</div><div class="ctl">${s.ready ? '✔ /health ok' : '✖ 未就绪'}</div></div>
    <div class="field"><div class="lab">监听端口</div><div class="ctl">${s.port}</div></div>
    <div class="field"><div class="lab">模型权重</div><div class="ctl" style="font-size:12px">${esc((STATE.catalog.models[0].file || ''))}</div></div>
    <div class="field"><div class="lab">启动命令</div><div class="ctl"></div><div class="help"><pre class="log" id="argsBox">读取中…</pre></div></div>
    <div class="field"><div class="lab">LoRA 适配器状态</div><div class="ctl" style="font-size:12px">${STATE.loraAdapters ? esc(JSON.stringify(STATE.loraAdapters)) : '未挂载'}</div></div>
    <div class="field"><div class="lab">日志文件</div><div class="ctl" style="font-size:12px;word-break:break-all">${esc(s.logPath || '–')}</div></div>`;
  const l = await (await fetch('/api/log?lines=6')).json();
  const box = $('#argsBox');
  if (box) box.textContent = (l.lines.find((x) => x.startsWith('# ')) || '(尚无)').slice(2);
}

/* ---------------------------------------------------------------- wiring */
$('#btnSet').onclick = () => { DRAFT = { ...STATE.settings }; renderSettings(); $('#dirty').textContent = '没有改动'; $('#setStatus').textContent = ''; $('#mask').classList.add('show'); };
$('#mask').onclick = (e) => { if (e.target.id === 'mask') $('#mask').classList.remove('show'); };
$('#btnRevert').onclick = () => { DRAFT = { ...STATE.settings }; renderSettings(); markDirty(); };
$('#btnApply').onclick = async () => {
  const b = $('#btnApply'); b.disabled = true; b.textContent = '应用中…';
  const r = await (await fetch('/api/settings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(DRAFT) })).json();
  b.disabled = false; b.textContent = '应用';
  $('#setStatus').textContent = (r.ok ? '✔ 已应用 ' + r.changed.length + ' 项' : '✖ ' + r.error) + (r.restarted ? '（引擎已重启）' : '') + (r.lora ? (' LoRA ' + r.lora.body) : '');
  await refresh(); DRAFT = { ...STATE.settings }; renderSettings(); markDirty();
};
$('#btnLog').onclick = async () => {
  $('#maskLog').classList.add('show');
  const l = await (await fetch('/api/log?lines=200')).json();
  $('#logBox').textContent = l.lines.join('\n') + '\n\n# 文件：' + (l.path || '–');
};
$('#btnServer').onclick = async () => {
  const action = STATE.server.running ? 'stop' : 'start';
  $('#btnServer').disabled = true;
  await fetch('/api/server', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action }) });
  setTimeout(async () => { await refresh(); $('#btnServer').disabled = false; }, 1500);
};
$('#btnImg').onclick = () => {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.multiple = true;
  i.onchange = () => addImages(i.files); i.click();
};
$('#btnSend').onclick = send;
$('#input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$('#input').addEventListener('input', (e) => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 220) + 'px'; });
document.addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.items || [])].filter((i) => i.type.startsWith('image/')).map((i) => i.getAsFile()).filter(Boolean);
  if (files.length) { addImages(files); e.preventDefault(); }
});
const drop = $('#drop');
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => addImages(e.dataTransfer.files));

refresh(); render(); renderAttach();
setInterval(refresh, 4000);
</script>
</body>
</html>
